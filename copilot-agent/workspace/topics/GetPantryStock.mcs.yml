mcs.metadata:
  componentName: Get pantry stock
  description: Returns every pantry item (Title is the item name) with its current stock, minimum stock level, reorder quantity, unit price, category, unit of measure, storage location and preferred supplier. Use it for questions about stock levels, low or out-of-stock items, what to reorder, item prices and where items are kept.
kind: TaskDialog
modelDisplayName: Get pantry stock
modelDescription: Returns every pantry item (Title is the item name) with its current stock, minimum stock level, reorder quantity, unit price, category, unit of measure, storage location and preferred supplier. Use it for questions about stock levels, low or out-of-stock items, what to reorder, item prices and where items are kept.
inputs:
  - kind: ManualTaskInput
    propertyName: dataset
    value: 'https://dheerajvyas173gmail.sharepoint.com/sites/OfficePantry'

  - kind: ManualTaskInput
    propertyName: table
    value: 'Pantry Items'

  - kind: ManualTaskInput
    propertyName: $orderby
    value: 'Title'

  - kind: ManualTaskInput
    propertyName: $top
    value: 500

outputs:
  - propertyName: value

action:
  kind: InvokeConnectorTaskAction
  connectionReference: cr_pantry_sharepoint
  connectionProperties:
    mode: Invoker

  operationId: GetItems

outputMode: All
