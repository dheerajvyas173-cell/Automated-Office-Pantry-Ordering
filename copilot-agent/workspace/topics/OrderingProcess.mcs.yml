mcs.metadata:
  componentName: How ordering works
  description: Explains how to request pantry supplies and what happens after a request is submitted.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: How ordering works
    triggerQueries:
      - How do I order supplies
      - How can I request pantry items
      - How does the approval process work
      - What happens after I submit a request
      - How do I place a pantry order
      - Who approves pantry orders

  actions:
    - kind: SendActivity
      id: sendMessage_ordering
      activity:
        text:
          - |-
            Here's how pantry ordering works:

            1. Open the **Pantry Supply Ordering** app and choose **New request**.
            2. **Inventory check:** you can request items at or below their minimum stock level. Well-stocked items are disabled (pantry admins can override).
            3. Add quantities, pick a required-by date and select **Submit request**. The app shows whether the order needs approval before you submit.
            4. **Approval limits:** orders over 5,000 INR or 50 units go to the office manager, who approves or rejects from an email (or the app). Smaller orders are approved automatically.
            5. You're emailed when your order is approved or rejected. Approved orders are emailed to each item's preferred supplier automatically and marked **Ordered**.
            6. When the delivery arrives, the pantry admin marks it **Received** and stock levels go up.

            The pantry admin also gets a low-stock email every morning at 8 AM. Follow your requests under **My requests** in the app.

    - kind: EndDialog
      id: endDialog_ordering
