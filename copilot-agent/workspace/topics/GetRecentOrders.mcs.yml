mcs.metadata:
  componentName: Get recent supply orders
  description: Returns the 100 most recent supply orders (Title is the order number) with order status, approval status, order date, required-by date, approval date, total amount, requester, approver, approver comments and created date. Use it for questions about orders, their status, approvals, the last order placed and spending.
kind: TaskDialog
modelDisplayName: Get recent supply orders
modelDescription: Returns the 100 most recent supply orders (Title is the order number) with order status, approval status, order date, required-by date, approval date, total amount, requester, approver, approver comments and created date. Use it for questions about orders, their status, approvals, the last order placed and spending.
inputs:
  - kind: ManualTaskInput
    propertyName: dataset
    value: 'https://dheerajvyas173gmail.sharepoint.com/sites/OfficePantry'

  - kind: ManualTaskInput
    propertyName: table
    value: 'Pantry Orders'

  - kind: ManualTaskInput
    propertyName: $orderby
    value: 'Created desc'

  - kind: ManualTaskInput
    propertyName: $top
    value: 100

outputs:
  - propertyName: value

action:
  kind: InvokeConnectorTaskAction
  connectionReference: cr_pantry_sharepoint
  connectionProperties:
    mode: Invoker

  operationId: GetItems

outputMode: All
