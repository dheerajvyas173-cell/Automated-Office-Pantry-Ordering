mcs.metadata:
  componentName: Get suppliers
  description: Returns all suppliers (Title is the supplier name) with contact person, email, phone, address, website, category and notes. Use it for supplier contact details and for finding which supplier provides which items.
kind: TaskDialog
modelDisplayName: Get suppliers
modelDescription: Returns all suppliers (Title is the supplier name) with contact person, email, phone, address, website, category and notes. Use it for supplier contact details and for finding which supplier provides which items.
inputs:
  - kind: ManualTaskInput
    propertyName: dataset
    value: 'https://dheerajvyas173gmail.sharepoint.com/sites/OfficePantry'

  - kind: ManualTaskInput
    propertyName: table
    value: 'Pantry Suppliers'

  - kind: ManualTaskInput
    propertyName: $orderby
    value: 'Title'

  - kind: ManualTaskInput
    propertyName: $top
    value: 100

outputs:
  - propertyName: value

action:
  kind: InvokeConnectorTaskAction
  connectionReference: cr_pantry_sharepoint
  connectionProperties:
    mode: Invoker

  operationId: GetItems

outputMode: All
