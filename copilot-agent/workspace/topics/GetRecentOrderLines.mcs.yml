mcs.metadata:
  componentName: Get recent order line items
  description: Returns the 300 most recent order lines (Title is the item name) with quantity, unit price, total cost, supplier, the supply order they belong to and the created date. Use it for questions about what was ordered, when an item was last ordered, and quantities.
kind: TaskDialog
modelDisplayName: Get recent order line items
modelDescription: Returns the 300 most recent order lines (Title is the item name) with quantity, unit price, total cost, supplier, the supply order they belong to and the created date. Use it for questions about what was ordered, when an item was last ordered, and quantities.
inputs:
  - kind: ManualTaskInput
    propertyName: dataset
    value: 'https://dheerajvyas173gmail.sharepoint.com/sites/OfficePantry'

  - kind: ManualTaskInput
    propertyName: table
    value: 'Pantry Order Lines'

  - kind: ManualTaskInput
    propertyName: $orderby
    value: 'Created desc'

  - kind: ManualTaskInput
    propertyName: $top
    value: 300

outputs:
  - propertyName: value

action:
  kind: InvokeConnectorTaskAction
  connectionReference: cr_pantry_sharepoint
  connectionProperties:
    mode: Invoker

  operationId: GetItems

outputMode: All
