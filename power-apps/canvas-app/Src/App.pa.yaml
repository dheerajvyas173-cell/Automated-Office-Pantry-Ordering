App:
  Properties:
    Formulas: |-
      =clrBrand = ColorValue("#0F6CBD");
      clrBrandTint = ColorValue("#EBF3FC");
      clrCanvas = ColorValue("#F5F5F5");
      clrSurface = Color.White;
      clrStroke = ColorValue("#E0E0E0");
      clrTextPrimary = ColorValue("#242424");
      clrTextSecondary = ColorValue("#616161");
      clrTextTertiary = ColorValue("#9E9E9E");
      clrSuccess = ColorValue("#107C10");
      clrWarning = ColorValue("#BC4B09");
      clrDanger = ColorValue("#C50F1F");
      gUserEmail = Lower(User().Email);
      imgHero = "data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='140' viewBox='0 0 1200 140' preserveAspectRatio='none'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#0F6CBD'/><stop offset='1' stop-color='#2886DE'/></linearGradient></defs><rect width='1200' height='140' fill='url(#g)'/><circle cx='1110' cy='10' r='120' fill='#FFFFFF' fill-opacity='0.08'/><circle cx='960' cy='150' r='80' fill='#FFFFFF' fill-opacity='0.06'/></svg>");
    OnStart: |-
      =Set(gRole, "Requester");
      ClearCollect(colItems, Sort('Pantry Items', 'Item Name'))
    Theme: =PantryTheme
