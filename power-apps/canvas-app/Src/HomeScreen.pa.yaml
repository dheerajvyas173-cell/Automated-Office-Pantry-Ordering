                              - HmRestockList:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                                  Properties:
                                    Fill: =Color.Transparent
                                    FillPortions: =1
                                    Items: =Sort(Filter(colItems, 'Current Stock' <= 'Minimum Stock Level'), 'Current Stock')
                                    LayoutMinHeight: =100
                                    TemplateSize: =64
                                  Children:
                                    - HmRsName:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextPrimary
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =14
                                          Text: =ThisItem.'Item Name'
                                          Width: =Parent.TemplateWidth - 260
                                          X: =4
                                          Y: =10
                                    - HmRsMeta:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextSecondary
                                          FontWeight: =FontWeight.Normal
                                          Height: =20
                                          Size: =12
                                          Text: ="In stock " & Coalesce(ThisItem.'Current Stock', 0) & "  ·  Minimum " & Coalesce(ThisItem.'Minimum Stock Level', 0)
                                          Width: =Parent.TemplateWidth - 260
                                          X: =4
                                          Y: =36
                                    - HmRsBadge:
                                        Control: ModernBadge@1.0.0
                                        Properties:
                                          Content: =If(ThisItem.'Current Stock' <= 0, "Out of stock", ThisItem.'Current Stock' <= ThisItem.'Minimum Stock Level', "Low stock", "In stock")
                                          Height: =24
                                          Intent: =If(ThisItem.'Current Stock' <= 0, BadgeIntent.Critical, ThisItem.'Current Stock' <= ThisItem.'Minimum Stock Level', BadgeIntent.Caution, BadgeIntent.Positive)
                                          Shape: =BadgeShape.Rounded
                                          Width: =104
                                          X: =Parent.TemplateWidth - 244
                                          Y: =20
                                    - HmRsAdd:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Height: =34
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =With({existing: LookUp(colCart, Item.'Pantry Item' = ThisItem.'Pantry Item'), qty: Coalesce(ThisItem.'Reorder Quantity', 1)},
                                                If(IsBlank(existing),
                                                    Collect(colCart, {Item: ThisItem, Qty: qty}),
                                                    Patch(colCart, existing, {Qty: existing.Qty + qty})
                                                )
                                            );
                                            If(ThisItem.'Current Stock' > ThisItem.'Minimum Stock Level',
                                                Notify(ThisItem.'Item Name' & " added. Note: the pantry still has " & ThisItem.'Current Stock' & " in stock.", NotificationType.Warning),
                                                Notify(ThisItem.'Item Name' & " added to your request.", NotificationType.Success)
                                            )
                                          Text: ="Request"
                                          Tooltip: ="Add the reorder quantity to your request"
                                          Width: =120
                                          X: =Parent.TemplateWidth - 128
                                          Y: =14
