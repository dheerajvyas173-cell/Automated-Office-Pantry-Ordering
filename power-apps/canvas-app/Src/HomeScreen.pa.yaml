Screens:
  HomeScreen:
    Properties:
      Fill: =clrCanvas
      OnVisible: |-
        =Concurrent(
            UpdateContext({locMyOpen: CountRows(Filter('Supply Orders', 'Requested By' = gUserEmail && ('Order Status' = [@'Order Status'].Submitted || 'Order Status' = [@'Order Status'].Approved || 'Order Status' = [@'Order Status'].Ordered)))}),
            UpdateContext({locAwaiting: CountRows(Filter('Supply Orders', 'Requested By' = gUserEmail && 'Order Status' = [@'Order Status'].Submitted))}),
            UpdateContext({locPendingAll: CountRows(Filter('Supply Orders', 'Order Status' = [@'Order Status'].Submitted))}),
            UpdateContext({locToReceive: CountRows(Filter('Supply Orders', 'Order Status' = [@'Order Status'].Ordered || 'Order Status' = [@'Order Status'].Approved))}),
            UpdateContext({locRecent: FirstN(Sort(Filter('Supply Orders', 'Requested By' = gUserEmail), 'Created On', SortOrder.Descending), 6)})
        )
    Children:
      - HmRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =clrCanvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - HmNavRail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =clrSurface
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  Width: =If(App.Width < 900, 72, 240)
                Children:
                  - HmBrand:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                      Children:
                        - HmBrandTile:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =clrBrand
                              FillPortions: =0
                              Height: =40
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =40
                            Children:
                              - HmBrandIcon:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =22
                                    Icon: ="FoodPizza"
                                    IconColor: =Color.White
                                    IconStyle: =IconStyle.Filled
                                    Width: =22
                                    X: =9
                                    Y: =9
                        - HmBrandText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinWidth: =0
                              Visible: =App.Width >= 900
                            Children:
                              - HmBrandName:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Size: =15
                                    Text: ="Office Pantry"
                              - HmBrandSub:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextSecondary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Normal
                                    Height: =16
                                    Size: =11
                                    Text: ="Supply ordering"
                  - HmNavGap:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =8
                  - HmNavHome:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Dashboard"
                        Appearance: =ButtonAppearance.Secondary
                        FillPortions: =0
                        Height: =40
                        Icon: ="Home"
                        IconStyle: =IconStyle.Filled
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(HomeScreen, ScreenTransition.None)
                        Text: ="Dashboard"
                        Tooltip: ="Dashboard"
                  - HmNavNewOrder:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="New request"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="Add"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(NewOrderScreen, ScreenTransition.None)
                        Text: ="New request" & If(CountRows(colCart) > 0, " (" & CountRows(colCart) & ")", "")
                        Tooltip: ="New request"
                  - HmNavMyOrders:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="My requests"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="DocumentBulletList"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(MyOrdersScreen, ScreenTransition.None)
                        Text: ="My requests"
                        Tooltip: ="My requests"
                  - HmNavInventory:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Inventory"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="Box"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(InventoryScreen, ScreenTransition.None)
                        Text: ="Inventory"
                        Tooltip: ="Inventory"
                  - HmNavApprovals:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Approvals"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="TaskListSquareLtr"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(ApprovalsScreen, ScreenTransition.None)
                        Text: ="Approvals"
                        Tooltip: ="Approvals"
                        Visible: =gRole = "Approver" || gRole = "Pantry Admin"
                  - HmNavReceiving:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Receiving"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="VehicleTruckProfile"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(ReceivingScreen, ScreenTransition.None)
                        Text: ="Receiving"
                        Tooltip: ="Receiving"
                        Visible: =gRole = "Pantry Admin"
                  - HmNavSpacer:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                  - HmRoleBox:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =clrCanvas
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Visible: =App.Width >= 900
                      Children:
                        - HmRoleCaption:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =clrTextSecondary
                              FillPortions: =0
                              FontWeight: =FontWeight.Semibold
                              Height: =16
                              Size: =11
                              Text: ="Viewing as"
                        - HmRole:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: ="Switch role"
                              DefaultSelectedItems: =[gRole]
                              FillPortions: =0
                              Height: =36
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =["Requester", "Approver", "Pantry Admin"]
                              OnChange: =Set(gRole, Coalesce(Self.Selected.Value, gRole))
                              SelectMultiple: =false
                  - HmUserRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                      Children:
                        - HmUserAvatar:
                            Control: ModernAvatar@1.1.0
                            Properties:
                              FillPortions: =0
                              Height: =32
                              Tooltip: =User().FullName
                              Width: =32
                        - HmUserText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinWidth: =0
                              Visible: =App.Width >= 900
                            Children:
                              - HmUserName:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =13
                                    Text: =User().FullName
                              - HmUserRoleText:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextSecondary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Normal
                                    Height: =16
                                    Size: =11
                                    Text: =gRole
            - HmMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinWidth: =0
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                Children:
                  - HmHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                      Children:
                        - HmTitleBlock:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinWidth: =0
                            Children:
                              - HmTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    Size: =26
                                    Text: ="Dashboard"
                              - HmSubtitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextSecondary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Normal
                                    Height: =22
                                    Size: =14
                                    Text: =Text(Today(), "dddd, dd mmmm yyyy")
                        - HmActions:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              Width: =120
                            Children:
                              - HmRefresh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Subtle
                                    FillPortions: =0
                                    Height: =36
                                    Icon: ="ArrowClockwise"
                                    OnSelect: =Refresh('Pantry Items'); ClearCollect(colItems, Sort('Pantry Items', 'Item Name'))
                                    Text: ="Refresh"
                                    Width: =120
                  - HmHero:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        FillPortions: =0
                        Height: =132
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - HmHeroImage:
                            Control: Image@2.2.3
                            Properties:
                              Height: =Parent.Height
                              Image: =imgHero
                              ImagePosition: =ImagePosition.Fill
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =Parent.Width
                        - HmHeroTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =Color.White
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =24
                              Text: ="Good " & Switch(true, Hour(Now()) < 12, "morning", Hour(Now()) < 17, "afternoon", "evening") & ", " & First(Split(User().FullName, " ")).Value
                              Width: =Parent.Width - 280
                              X: =28
                              Y: =26
                        - HmHeroSubtitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(255, 255, 255, 0.88)
                              FontWeight: =FontWeight.Normal
                              Height: =40
                              Size: =14
                              Text: |-
                                =Switch(gRole,
                                    "Approver", locPendingAll & " request(s) are waiting for your decision.",
                                    "Pantry Admin", CountRows(Filter(colItems, 'Current Stock' <= 'Minimum Stock Level')) & " item(s) need restocking and " & locToReceive & " order(s) are on their way.",
                                    "Request pantry supplies and follow them from approval to delivery.")
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width - 280
                              X: =28
                              Y: =66
                        - HmHeroAction:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Secondary
                              Height: =40
                              Icon: =Switch(gRole, "Approver", "TaskListSquareLtr", "Pantry Admin", "VehicleTruckProfile", "Add")
                              OnSelect: |-
                                =Switch(gRole,
                                    "Approver", Navigate(ApprovalsScreen, ScreenTransition.None),
                                    "Pantry Admin", Navigate(ReceivingScreen, ScreenTransition.None),
                                    Navigate(NewOrderScreen, ScreenTransition.None))
                              Text: =Switch(gRole, "Approver", "Review approvals", "Pantry Admin", "Receive orders", "New request")
                              Width: =188
                              X: =Parent.Width - 216
                              Y: =46
                  - HmKpis:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =112
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                      Children:
                        - HmKpiLow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =clrStroke
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =clrSurface
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinWidth: =200
                              PaddingBottom: =14
                              PaddingLeft: =14
                              PaddingRight: =14
                              PaddingTop: =14
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - HmKpiLowChip:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =ColorFade(If(CountRows(Filter(colItems, 'Current Stock' <= 'Minimum Stock Level')) > 0, clrDanger, clrSuccess), 0.86)
                                    FillPortions: =0
                                    Height: =40
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Width: =40
                                  Children:
                                    - HmKpiLowChipIcon:
                                        Control: ModernIcon@1.1.1
                                        Properties:
                                          Height: =20
                                          Icon: ="Warning"
                                          IconColor: =If(CountRows(Filter(colItems, 'Current Stock' <= 'Minimum Stock Level')) > 0, clrDanger, clrSuccess)
                                          IconStyle: =IconStyle.Filled
                                          Width: =20
                                          X: =10
                                          Y: =10
                              - HmKpiLowText:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =1
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =0
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinWidth: =0
                                  Children:
                                    - HmKpiLowCaption:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextSecondary
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =13
                                          Text: ="Low stock items"
                                    - HmKpiLowValue:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextPrimary
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Semibold
                                          Height: =40
                                          Size: =28
                                          Text: =CountRows(Filter(colItems, 'Current Stock' <= 'Minimum Stock Level'))
                                    - HmKpiLowHint:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextSecondary
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Normal
                                          Height: =18
                                          Size: =12
                                          Text: ="At or below minimum"
                        - HmKpiOpen:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =clrStroke
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =clrSurface
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinWidth: =200
                              PaddingBottom: =14
                              PaddingLeft: =14
                              PaddingRight: =14
                              PaddingTop: =14
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - HmKpiOpenChip:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =ColorFade(clrBrand, 0.86)
                                    FillPortions: =0
                                    Height: =40
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Width: =40
                                  Children:
                                    - HmKpiOpenChipIcon:
                                        Control: ModernIcon@1.1.1
                                        Properties:
                                          Height: =20
                                          Icon: ="DocumentBulletList"
                                          IconColor: =clrBrand
                                          IconStyle: =IconStyle.Filled
                                          Width: =20
                                          X: =10
                                          Y: =10
                              - HmKpiOpenText:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =1
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =0
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinWidth: =0
                                  Children:
                                    - HmKpiOpenCaption:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextSecondary
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =13
                                          Text: ="My open requests"
                                    - HmKpiOpenValue:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextPrimary
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Semibold
                                          Height: =40
                                          Size: =28
                                          Text: =locMyOpen
                                    - HmKpiOpenHint:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextSecondary
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Normal
                                          Height: =18
                                          Size: =12
                                          Text: ="Waiting or in progress"
                        - HmKpiAwaiting:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =clrStroke
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =clrSurface
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinWidth: =200
                              PaddingBottom: =14
                              PaddingLeft: =14
                              PaddingRight: =14
                              PaddingTop: =14
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - HmKpiAwaitingChip:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =ColorFade(clrWarning, 0.86)
                                    FillPortions: =0
                                    Height: =40
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Width: =40
                                  Children:
                                    - HmKpiAwaitingChipIcon:
                                        Control: ModernIcon@1.1.1
                                        Properties:
                                          Height: =20
                                          Icon: ="Clock"
                                          IconColor: =clrWarning
                                          IconStyle: =IconStyle.Filled
                                          Width: =20
                                          X: =10
                                          Y: =10
                              - HmKpiAwaitingText:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =1
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =0
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinWidth: =0
                                  Children:
                                    - HmKpiAwaitingCaption:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextSecondary
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =13
                                          Text: ="Approvals pending"
                                    - HmKpiAwaitingValue:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextPrimary
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Semibold
                                          Height: =40
                                          Size: =28
                                          Text: =If(gRole = "Requester", locAwaiting, locPendingAll)
                                    - HmKpiAwaitingHint:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextSecondary
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Normal
                                          Height: =18
                                          Size: =12
                                          Text: =If(gRole = "Requester", "Waiting for a decision", "Across the office")
                        - HmKpiCatalog:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =clrStroke
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =clrSurface
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinWidth: =200
                              PaddingBottom: =14
                              PaddingLeft: =14
                              PaddingRight: =14
                              PaddingTop: =14
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - HmKpiCatalogChip:
                                  Control: GroupContainer@1.5.0
