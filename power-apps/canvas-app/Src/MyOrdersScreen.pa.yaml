      - MoDialog:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.35)
            Height: =Parent.Height
            Visible: =locConfirmCancel
            Width: =Parent.Width
          Children:
            - MoDialogCard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =clrStroke
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =clrSurface
                  Height: =200
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =440
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - MoDialogTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =clrTextPrimary
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        Size: =20
                        Text: ="Cancel this request?"
                  - MoDialogText:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =clrTextSecondary
                        FontWeight: =FontWeight.Normal
                        Height: =60
                        Size: =14
                        Text: ="The request will be marked as cancelled and won't be sent to suppliers."
                        VerticalAlign: =VerticalAlign.Top
                  - MoDialogButtons:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =40
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                      Children:
                        - MoDialogSpacer:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                        - MoDialogCancel:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Secondary
                              Height: =36
                              OnSelect: |-
                                =UpdateContext({locConfirmCancel: false})
                              Text: ="Keep request"
                              Width: =140
                        - MoDialogConfirm:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Primary
                              Height: =36
                              OnSelect: |-
                                =UpdateContext({locConfirmCancel: false});
                                UpdateContext({locBusy: true});
                                IfError(
                                    Patch('Supply Orders', gSelOrder, {'Order Status': [@'Order Status'].Cancelled});
                                    Set(gSelOrder, LookUp('Supply Orders', 'Supply Order' = gSelOrder.'Supply Order'));
                                    Notify("Request cancelled.", NotificationType.Success),
                                    Notify("Something went wrong: " & FirstError.Message, NotificationType.Error)
                                );
                                UpdateContext({locBusy: false})
                              Text: ="Cancel request"
                              Width: =160
      - MoBusy:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.35)
            Height: =Parent.Height
            Visible: =locBusy
            Width: =Parent.Width
          Children:
            - MoBusyCard:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =clrSurface
                  Height: =120
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =280
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
