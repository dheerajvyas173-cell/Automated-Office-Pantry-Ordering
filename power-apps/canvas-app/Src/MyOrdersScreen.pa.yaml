Screens:
  MyOrdersScreen:
    Properties:
      Fill: =clrCanvas
      OnVisible: =If(!IsBlank(gSelOrder), Set(gSelOrder, LookUp('Supply Orders', 'Supply Order' = gSelOrder.'Supply Order')))
    Children:
      - MoRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =clrCanvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - MoNavRail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =clrSurface
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  Width: =If(App.Width < 900, 72, 240)
                Children:
                  - MoBrand:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                      Children:
                        - MoBrandTile:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =clrBrand
                              FillPortions: =0
                              Height: =40
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =40
                            Children:
                              - MoBrandIcon:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =22
                                    Icon: ="FoodPizza"
                                    IconColor: =Color.White
                                    IconStyle: =IconStyle.Filled
                                    Width: =22
                                    X: =9
                                    Y: =9
                        - MoBrandText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              Visible: =App.Width >= 900
                            Children:
                              - MoBrandName:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Size: =15
                                    Text: ="Office Pantry"
                              - MoBrandSub:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextSecondary
                                    FontWeight: =FontWeight.Normal
                                    Height: =16
                                    Size: =11
                                    Text: ="Supply ordering"
                  - MoNavGap:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =8
                  - MoNavHome:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Dashboard"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =40
                        Icon: ="Home"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(HomeScreen, ScreenTransition.None)
                        Text: ="Dashboard"
                        Tooltip: ="Dashboard"
                  - MoNavNewOrder:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="New request"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =40
                        Icon: ="Add"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(NewOrderScreen, ScreenTransition.None)
                        Text: ="New request" & If(CountRows(colCart) > 0, " (" & CountRows(colCart) & ")", "")
                        Tooltip: ="New request"
                  - MoNavMyOrders:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="My requests"
                        Appearance: =ButtonAppearance.Secondary
                        Height: =40
                        Icon: ="DocumentBulletList"
                        IconStyle: =IconStyle.Filled
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(MyOrdersScreen, ScreenTransition.None)
                        Text: ="My requests"
                        Tooltip: ="My requests"
                  - MoNavInventory:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Inventory"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =40
                        Icon: ="Box"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(InventoryScreen, ScreenTransition.None)
                        Text: ="Inventory"
                        Tooltip: ="Inventory"
                  - MoNavApprovals:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Approvals"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =40
                        Icon: ="TaskListSquareLtr"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(ApprovalsScreen, ScreenTransition.None)
                        Text: ="Approvals"
                        Tooltip: ="Approvals"
                        Visible: =gRole = "Approver" || gRole = "Pantry Admin"
                  - MoNavReceiving:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Receiving"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =40
                        Icon: ="VehicleTruckProfile"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(ReceivingScreen, ScreenTransition.None)
                        Text: ="Receiving"
                        Tooltip: ="Receiving"
                        Visible: =gRole = "Pantry Admin"
                  - MoNavSpacer:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                  - MoRoleBox:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =clrCanvas
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Visible: =App.Width >= 900
                      Children:
                        - MoRoleCaption:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =clrTextSecondary
                              FontWeight: =FontWeight.Semibold
                              Height: =16
                              Size: =11
                              Text: ="Viewing as"
                        - MoRole:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: ="Switch role"
                              DefaultSelectedItems: =[gRole]
                              Height: =36
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =["Requester", "Approver", "Pantry Admin"]
                              OnChange: =Set(gRole, Coalesce(Self.Selected.Value, gRole))
                              SelectMultiple: =false
                  - MoUserRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                      Children:
                        - MoUserAvatar:
                            Control: ModernAvatar@1.1.0
                            Properties:
                              Height: =32
                              Tooltip: =User().FullName
                              Width: =32
                        - MoUserText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              Visible: =App.Width >= 900
                            Children:
                              - MoUserName:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =13
                                    Text: =User().FullName
                              - MoUserRoleText:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextSecondary
                                    FontWeight: =FontWeight.Normal
                                    Height: =16
                                    Size: =11
                                    Text: =gRole
            - MoMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                Children:
                  - MoHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                      Children:
                        - MoTitleBlock:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                            Children:
                              - MoTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    Size: =26
                                    Text: ="My requests"
                              - MoSubtitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextSecondary
                                    FontWeight: =FontWeight.Normal
                                    Height: =22
                                    Size: =14
                                    Text: ="Track your supply requests and their approvals."
                        - MoActions:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              Width: =320
                            Children:
                              - MoRefresh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =36
                                    Icon: ="ArrowClockwise"
                                    OnSelect: =Refresh('Supply Orders'); If(!IsBlank(gSelOrder), Set(gSelOrder, LookUp('Supply Orders', 'Supply Order' = gSelOrder.'Supply Order')))
                                    Text: ="Refresh"
                                    Width: =120
                              - MoNew:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Primary
                                    Height: =36
                                    Icon: ="Add"
                                    OnSelect: =Navigate(NewOrderScreen, ScreenTransition.None)
                                    Text: ="New request"
                                    Width: =150
                  - MoBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                      Children:
                        - MoList:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =clrStroke
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =clrSurface
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =If(App.Width < 1200, 360, 420)
                            Children:
                              - MoTabs:
                                  Control: ModernTabList@1.0.2
                                  Properties:
                                    AccessibleLabel: ="Filter requests"
                                    Alignment: =TabListAlignment.Start
                                    Appearance: =TabListAppearance.SubtleCircular
                                    Height: =40
                                    Items: =["All", "Open", "Completed"]
                              - MoSearch:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    AccessibleLabel: ="Search requests"
                                    Height: =36
                                    Placeholder: ="Search by request number"
                                    TriggerOutput: =TriggerOutput.Delayed
                                    Type: =TextInputType.Search
                              - MoOrders:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                                  Properties:
                                    Fill: =Color.Transparent
                                    Items: |-
                                      =Sort(
                                          Switch(MoTabs.Selected.Value,
                                              "Open", Filter('Supply Orders', 'Requested By' = gUserEmail && StartsWith('Order Number', MoSearch.Text) && ('Order Status' = [@'Order Status'].Draft || 'Order Status' = [@'Order Status'].Submitted || 'Order Status' = [@'Order Status'].Approved || 'Order Status' = [@'Order Status'].Ordered || 'Order Status' = [@'Order Status'].'Partially Received')),
                                              "Completed", Filter('Supply Orders', 'Requested By' = gUserEmail && StartsWith('Order Number', MoSearch.Text) && ('Order Status' = [@'Order Status'].Received || 'Order Status' = [@'Order Status'].Rejected || 'Order Status' = [@'Order Status'].Cancelled)),
                                              Filter('Supply Orders', 'Requested By' = gUserEmail && StartsWith('Order Number', MoSearch.Text))
                                          ),
                                          'Created On', SortOrder.Descending
                                      )
                                    LayoutMinHeight: =120
                                    OnSelect: =Set(gSelOrder, ThisItem)
                                    TemplateFill: =If(!IsBlank(gSelOrder) && ThisItem.'Supply Order' = gSelOrder.'Supply Order', clrBrandTint, Color.Transparent)
                                    TemplateSize: =72
                                  Children:
                                    - MoOrSelBar:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =clrBrand
                                          Height: =Parent.TemplateHeight - 20
                                          RadiusBottomLeft: =2
                                          RadiusBottomRight: =2
                                          RadiusTopLeft: =2
                                          RadiusTopRight: =2
                                          Visible: =!IsBlank(gSelOrder) && ThisItem.'Supply Order' = gSelOrder.'Supply Order'
                                          Width: =3
                                          Y: =10
                                    - MoOrNumber:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextPrimary
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =14
                                          Text: =ThisItem.'Order Number'
                                          Width: =Parent.TemplateWidth - 170
                                          X: =14
                                          Y: =12
                                    - MoOrMeta:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextSecondary
                                          FontWeight: =FontWeight.Normal
                                          Height: =20
                                          Size: =12
                                          Text: =Text(ThisItem.'Created On', "dd mmm yyyy") & "  ·  " & Text(Coalesce(ThisItem.'Total Amount', 0), "#,##0.00")
                                          Width: =Parent.TemplateWidth - 170
                                          X: =14
                                          Y: =38
                                    - MoOrBadge:
                                        Control: ModernBadge@1.0.0
                                        Properties:
                                          Content: =Text(ThisItem.'Order Status')
                                          Height: =24
                                          Intent: =Switch(Text(ThisItem.'Order Status'), "Received", BadgeIntent.Positive, "Ordered", BadgeIntent.Positive, "Approved", BadgeIntent.Highlight, "Submitted", BadgeIntent.Informative, "Partially Received", BadgeIntent.Caution, "Rejected", BadgeIntent.Critical, BadgeIntent.Neutral)
                                          Shape: =BadgeShape.Rounded
                                          Width: =128
                                          X: =Parent.TemplateWidth - 142
                                          Y: =24
                                    - MoOrDivider:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =clrStroke
                                          Height: =1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                              - MoOrdersEmpty:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =96
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    Visible: =IsEmpty(MoOrders.AllItems)
                                  Children:
                                    - MoOrdersEmptyIcon:
                                        Control: ModernIcon@1.1.1
                                        Properties:
                                          Height: =28
                                          Icon: ="DocumentSearch"
                                          IconColor: =clrTextTertiary
                                          Width: =28
                                    - MoOrdersEmptyText:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =clrTextSecondary
                                          FontWeight: =FontWeight.Normal
                                          Height: =40
                                          Size: =13
                                          Text: ="No requests found."
                        - MoDetail:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =clrStroke
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =clrSurface
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =16
                              LayoutMinWidth: =440
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =24
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - MoDetailBody:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =16
                                    Visible: =!IsBlank(gSelOrder)
                                  Children:
                                    - MoDetailHead:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =12
                                        Children:
                                          - MoDetailNumber:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Color: =clrTextPrimary
                                                FillPortions: =1
                                                FontWeight: =FontWeight.Semibold
                                                Height: =32
                                                Size: =20
                                                Text: =gSelOrder.'Order Number'
                                          - MoDetailBadge:
                                              Control: ModernBadge@1.0.0
                                              Properties:
                                                Content: =Text(gSelOrder.'Order Status')
                                                Height: =28
                                                Intent: =Switch(Text(gSelOrder.'Order Status'), "Received", BadgeIntent.Positive, "Ordered", BadgeIntent.Positive, "Approved", BadgeIntent.Highlight, "Submitted", BadgeIntent.Informative, "Partially Received", BadgeIntent.Caution, "Rejected", BadgeIntent.Critical, BadgeIntent.Neutral)
                                                Shape: =BadgeShape.Rounded
                                                Width: =140
                                          - MoCancelBtn:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                Appearance: =ButtonAppearance.Outline
                                                Height: =36
                                                Icon: ="Dismiss"
                                                OnSelect: |-
                                                  =UpdateContext({locConfirmCancel: true})
                                                Text: ="Cancel request"
                                                Visible: =Text(gSelOrder.'Order Status') in ["Draft", "Submitted"]
                                                Width: =160
                                    - MoFields:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =48
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =16
                                        Children:
                                          - MoFCreated:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =Color.Transparent
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutMinWidth: =110
                                              Children:
                                                - MoFCreatedCaption:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextSecondary
                                                      FontWeight: =FontWeight.Normal
                                                      Height: =18
                                                      Size: =12
                                                      Text: ="Created"
                                                - MoFCreatedValue:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextPrimary
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =22
                                                      Size: =14
                                                      Text: =Text(gSelOrder.'Created On', "dd mmm yyyy")
                                          - MoFRequired:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =Color.Transparent
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutMinWidth: =110
                                              Children:
                                                - MoFRequiredCaption:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextSecondary
                                                      FontWeight: =FontWeight.Normal
                                                      Height: =18
                                                      Size: =12
                                                      Text: ="Required by"
                                                - MoFRequiredValue:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextPrimary
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =22
                                                      Size: =14
                                                      Text: =Text(gSelOrder.'Required By Date', "dd mmm yyyy")
                                          - MoFTotal:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =Color.Transparent
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutMinWidth: =110
                                              Children:
                                                - MoFTotalCaption:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextSecondary
                                                      FontWeight: =FontWeight.Normal
                                                      Height: =18
                                                      Size: =12
                                                      Text: ="Estimated total"
                                                - MoFTotalValue:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextPrimary
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =22
                                                      Size: =14
                                                      Text: =Text(Coalesce(gSelOrder.'Total Amount', 0), "#,##0.00")
                                          - MoFApproval:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =Color.Transparent
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutMinWidth: =110
                                              Children:
                                                - MoFApprovalCaption:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextSecondary
                                                      FontWeight: =FontWeight.Normal
                                                      Height: =18
                                                      Size: =12
                                                      Text: ="Approval"
                                                - MoFApprovalValue:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextPrimary
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =22
                                                      Size: =14
                                                      Text: =Coalesce(Text(gSelOrder.'Approval Status'), "Not started")
                                    - MoComments:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextSecondary
                                          FontWeight: =FontWeight.Normal
                                          Height: =40
                                          Size: =13
                                          Text: |-
                                            ="Approver comments: " & gSelOrder.'Approver Comments'
                                          VerticalAlign: =VerticalAlign.Top
                                          Visible: =!IsBlank(gSelOrder.'Approver Comments')
                                    - MoDetailCols:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =24
                                        Children:
                                          - MoLinesCol:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =Color.Transparent
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =8
                                              Children:
                                                - MoLnHead:
