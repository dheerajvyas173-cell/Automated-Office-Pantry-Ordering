Screens:
  ApprovalsScreen:
    Properties:
      Fill: =clrCanvas
    Children:
      - ApRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =clrCanvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - ApNavRail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =clrSurface
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  Width: =If(App.Width < 900, 72, 240)
                Children:
                  - ApBrand:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                      Children:
                        - ApBrandTile:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =clrBrand
                              FillPortions: =0
                              Height: =40
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =40
                            Children:
                              - ApBrandIcon:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =22
                                    Icon: ="FoodPizza"
                                    IconColor: =Color.White
                                    IconStyle: =IconStyle.Filled
                                    Width: =22
                                    X: =9
                                    Y: =9
                        - ApBrandText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinWidth: =0
                              Visible: =App.Width >= 900
                            Children:
                              - ApBrandName:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Size: =15
                                    Text: ="Office Pantry"
                              - ApBrandSub:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextSecondary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Normal
                                    Height: =16
                                    Size: =11
                                    Text: ="Supply ordering"
                  - ApNavGap:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =8
                  - ApNavHome:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Dashboard"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="Home"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(HomeScreen, ScreenTransition.None)
                        Text: ="Dashboard"
                        Tooltip: ="Dashboard"
                  - ApNavNewOrder:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="New request"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="Add"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(NewOrderScreen, ScreenTransition.None)
                        Text: ="New request" & If(CountRows(colCart) > 0, " (" & CountRows(colCart) & ")", "")
                        Tooltip: ="New request"
                  - ApNavMyOrders:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="My requests"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="DocumentBulletList"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(MyOrdersScreen, ScreenTransition.None)
                        Text: ="My requests"
                        Tooltip: ="My requests"
                  - ApNavInventory:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Inventory"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="Box"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(InventoryScreen, ScreenTransition.None)
                        Text: ="Inventory"
                        Tooltip: ="Inventory"
                  - ApNavApprovals:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Approvals"
                        Appearance: =ButtonAppearance.Secondary
                        FillPortions: =0
                        Height: =40
                        Icon: ="TaskListSquareLtr"
                        IconStyle: =IconStyle.Filled
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(ApprovalsScreen, ScreenTransition.None)
                        Text: ="Approvals"
                        Tooltip: ="Approvals"
                        Visible: =gRole = "Approver" || gRole = "Pantry Admin"
                  - ApNavReceiving:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Receiving"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="VehicleTruckProfile"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(ReceivingScreen, ScreenTransition.None)
                        Text: ="Receiving"
                        Tooltip: ="Receiving"
                        Visible: =gRole = "Pantry Admin"
                  - ApNavSpacer:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                  - ApRoleBox:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =clrCanvas
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Visible: =App.Width >= 900
                      Children:
                        - ApRoleCaption:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =clrTextSecondary
                              FillPortions: =0
                              FontWeight: =FontWeight.Semibold
                              Height: =16
                              Size: =11
                              Text: ="Viewing as"
                        - ApRole:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: ="Switch role"
                              DefaultSelectedItems: =[gRole]
                              FillPortions: =0
                              Height: =36
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =["Requester", "Approver", "Pantry Admin"]
                              OnChange: =Set(gRole, Coalesce(Self.Selected.Value, gRole)); If(!(gRole = "Approver" || gRole = "Pantry Admin"), Navigate(HomeScreen, ScreenTransition.None))
                              SelectMultiple: =false
                  - ApUserRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                      Children:
                        - ApUserAvatar:
                            Control: ModernAvatar@1.1.0
                            Properties:
                              FillPortions: =0
                              Height: =32
                              Tooltip: =User().FullName
                              Width: =32
                        - ApUserText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinWidth: =0
                              Visible: =App.Width >= 900
                            Children:
                              - ApUserName:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =13
                                    Text: =User().FullName
                              - ApUserRoleText:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextSecondary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Normal
                                    Height: =16
                                    Size: =11
                                    Text: =gRole
            - ApMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinWidth: =0
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                Children:
                  - ApHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                      Children:
                        - ApTitleBlock:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinWidth: =0
                            Children:
                              - ApTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    Size: =26
                                    Text: ="Approvals"
                              - ApSubtitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextSecondary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Normal
                                    Height: =22
                                    Size: =14
                                    Text: ="Review supply requests from the whole office. Approved requests are emailed to suppliers automatically."
                        - ApActions:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              Width: =120
                            Children:
                              - ApRefresh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Subtle
                                    FillPortions: =0
                                    Height: =36
                                    Icon: ="ArrowClockwise"
                                    OnSelect: =Refresh('Supply Orders'); Set(gApprOrder, Blank())
                                    Text: ="Refresh"
                                    Width: =120
                  - ApBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMinHeight: =0
                      Children:
                        - ApList:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =clrStroke
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =clrSurface
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =If(App.Width < 1200, 380, 440)
                            Children:
                              - ApTabs:
                                  Control: ModernTabList@1.0.2
                                  Properties:
                                    AccessibleLabel: ="Filter approvals"
                                    Alignment: =TabListAlignment.Start
                                    Appearance: =TabListAppearance.SubtleCircular
                                    FillPortions: =0
                                    Height: =40
                                    Items: =["Pending", "Decided"]
                              - ApOrders:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                                  Properties:
                                    Fill: =Color.Transparent
                                    FillPortions: =1
                                    Items: |-
                                      =Switch(ApTabs.Selected.Value,
                                              "Decided", Sort(Filter('Supply Orders', 'Approval Status' = [@'Approval Status'].Approved || 'Approval Status' = [@'Approval Status'].Rejected), 'Modified On', SortOrder.Descending),
                                              Sort(Filter('Supply Orders', 'Order Status' = [@'Order Status'].Submitted), 'Created On', SortOrder.Ascending))
                                    LayoutMinHeight: =100
                                    OnSelect: =Set(gApprOrder, ThisItem)
                                    TemplateFill: =If(!IsBlank(gApprOrder) && ThisItem.'Supply Order' = gApprOrder.'Supply Order', clrBrandTint, Color.Transparent)
                                    TemplateSize: =72
                                  Children:
                                    - ApOrSelBar:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =clrBrand
                                          Height: =Parent.TemplateHeight - 20
                                          Visible: =!IsBlank(gApprOrder) && ThisItem.'Supply Order' = gApprOrder.'Supply Order'
                                          Width: =3
                                          Y: =10
                                    - ApOrNumber:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextPrimary
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =14
                                          Text: =ThisItem.'Order Number'
                                          Width: =Parent.TemplateWidth - 170
                                          X: =14
                                          Y: =12
                                    - ApOrMeta:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextSecondary
                                          FontWeight: =FontWeight.Normal
                                          Height: =20
                                          Size: =12
                                          Text: =ThisItem.'Requested By' & "  ·  " & Text(Coalesce(ThisItem.'Total Amount', 0), "#,##0.00")
                                          Width: =Parent.TemplateWidth - 170
                                          X: =14
                                          Y: =38
                                    - ApOrBadge:
                                        Control: ModernBadge@1.0.0
                                        Properties:
                                          Content: =Text(ThisItem.'Order Status')
                                          Height: =24
                                          Intent: =Switch(Text(ThisItem.'Order Status'), "Received", BadgeIntent.Positive, "Ordered", BadgeIntent.Positive, "Approved", BadgeIntent.Highlight, "Submitted", BadgeIntent.Informative, "Partially Received", BadgeIntent.Caution, "Rejected", BadgeIntent.Critical, BadgeIntent.Neutral)
                                          Shape: =BadgeShape.Rounded
                                          Width: =128
                                          X: =Parent.TemplateWidth - 142
                                          Y: =24
                                    - ApOrDivider:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =clrStroke
                                          Height: =1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                              - ApOrdersEmpty:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =80
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    Visible: =IsEmpty(ApOrders.AllItems)
                                  Children:
                                    - ApOrdersEmptyIcon:
                                        Control: ModernIcon@1.1.1
                                        Properties:
                                          FillPortions: =0
                                          Height: =28
                                          Icon: ="CheckmarkCircle"
                                          IconColor: =clrTextTertiary
                                          Width: =28
                                    - ApOrdersEmptyText:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =clrTextSecondary
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Normal
                                          Height: =40
                                          Size: =13
                                          Text: ="Nothing here right now."
                        - ApDetail:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =clrStroke
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =clrSurface
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =16
                              LayoutMinWidth: =440
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =24
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - ApDetailBody:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =1
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    Visible: =!IsBlank(gApprOrder)
                                  Children:
                                    - ApDetailHead:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =12
                                        Children:
                                          - ApDetailNumber:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Color: =clrTextPrimary
                                                FillPortions: =1
                                                FontWeight: =FontWeight.Semibold
                                                Height: =32
                                                Size: =20
                                                Text: =gApprOrder.'Order Number'
                                          - ApDetailBadge:
                                              Control: ModernBadge@1.0.0
                                              Properties:
                                                Content: =Text(gApprOrder.'Order Status')
                                                FillPortions: =0
                                                Height: =28
                                                Intent: =Switch(Text(gApprOrder.'Order Status'), "Received", BadgeIntent.Positive, "Ordered", BadgeIntent.Positive, "Approved", BadgeIntent.Highlight, "Submitted", BadgeIntent.Informative, "Partially Received", BadgeIntent.Caution, "Rejected", BadgeIntent.Critical, BadgeIntent.Neutral)
                                                Shape: =BadgeShape.Rounded
                                                Width: =140
                                    - ApFields:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =48
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =16
                                        Children:
                                          - ApFBy:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                DropShadow: =DropShadow.None
                                                Fill: =Color.Transparent
                                                FillPortions: =1
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutMinWidth: =110
                                              Children:
                                                - ApFByCaption:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextSecondary
                                                      FillPortions: =0
                                                      FontWeight: =FontWeight.Normal
                                                      Height: =18
                                                      Size: =12
                                                      Text: ="Requested by"
                                                - ApFByValue:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextPrimary
                                                      FillPortions: =0
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =22
                                                      Size: =14
                                                      Text: =gApprOrder.'Requested By'
                                          - ApFRequired:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                DropShadow: =DropShadow.None
                                                Fill: =Color.Transparent
                                                FillPortions: =1
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutMinWidth: =110
                                              Children:
                                                - ApFRequiredCaption:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextSecondary
                                                      FillPortions: =0
                                                      FontWeight: =FontWeight.Normal
                                                      Height: =18
                                                      Size: =12
                                                      Text: ="Required by"
                                                - ApFRequiredValue:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextPrimary
                                                      FillPortions: =0
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =22
                                                      Size: =14
                                                      Text: =Text(gApprOrder.'Required By Date', "dd mmm yyyy")
                                          - ApFTotal:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                DropShadow: =DropShadow.None
                                                Fill: =Color.Transparent
                                                FillPortions: =1
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutMinWidth: =110
                                              Children:
                                                - ApFTotalCaption:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextSecondary
                                                      FillPortions: =0
                                                      FontWeight: =FontWeight.Normal
                                                      Height: =18
                                                      Size: =12
                                                      Text: ="Estimated total"
                                                - ApFTotalValue:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextPrimary
                                                      FillPortions: =0
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =22
                                                      Size: =14
                                                      Text: =Text(Coalesce(gApprOrder.'Total Amount', 0), "#,##0.00")
                                          - ApFWhere:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                DropShadow: =DropShadow.None
                                                Fill: =Color.Transparent
                                                FillPortions: =1
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutMinWidth: =110
                                              Children:
                                                - ApFWhereCaption:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextSecondary
                                                      FillPortions: =0
                                                      FontWeight: =FontWeight.Normal
                                                      Height: =18
                                                      Size: =12
                                                      Text: ="Deliver to"
                                                - ApFWhereValue:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Color: =clrTextPrimary
                                                      FillPortions: =0
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =22
                                                      Size: =14
                                                      Text: =Coalesce(gApprOrder.'Delivery Address', "-")
                                    - ApWhy:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextSecondary
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Normal
                                          Height: =40
                                          Size: =13
                                          Text: |-
                                            ="Justification: " & Coalesce(gApprOrder.Justification, "none given")
                                          VerticalAlign: =VerticalAlign.Top
                                    - ApLnHead:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =36
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                        Children:
                                          - ApLnHeadIcon:
                                              Control: ModernIcon@1.1.1
                                              Properties:
                                                FillPortions: =0
                                                Height: =20
                                                Icon: ="BoxMultiple"
                                                IconColor: =clrBrand
                                                IconStyle: =IconStyle.Filled
                                                Width: =20
                                          - ApLnHeadTitle:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Color: =clrTextPrimary
                                                FillPortions: =1
                                                FontWeight: =FontWeight.Semibold
                                                Height: =28
                                                LayoutMinWidth: =0
                                                Size: =16
                                                Text: ="Items"
                                    - ApLines:
                                        Control: Gallery@2.15.0
                                        Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                                        Properties:
                                          Fill: =Color.Transparent
                                          FillPortions: =1
                                          Items: =Filter('Order Line Items', 'Supply Order'.'Supply Order' = gApprOrder.'Supply Order')
                                          LayoutMinHeight: =100
                                          TemplateSize: =56
                                        Children:
                                          - ApLnName:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Color: =clrTextPrimary
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                Size: =13
                                                Text: =ThisItem.'Line Item Name'
                                                Width: =Parent.TemplateWidth - 130
                                                X: =4
                                                Y: =6
                                          - ApLnSupplier:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Color: =clrTextSecondary
                                                FontWeight: =FontWeight.Normal
                                                Height: =20
                                                Size: =12
                                                Text: =Coalesce(ThisItem.Supplier.'Supplier Name', "No supplier set")
                                                Width: =Parent.TemplateWidth - 130
                                                X: =4
                                                Y: =30
                                          - ApLnQty:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Align: =Align.Right
                                                Color: =clrTextPrimary
                                                FontWeight: =FontWeight.Semibold
                                                Height: =22
                                                Size: =14
                                                Text: ="× " & ThisItem.Quantity
                                                Width: =112
                                                X: =Parent.TemplateWidth - 120
                                                Y: =6
                                          - ApLnCost:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Align: =Align.Right
                                                Color: =clrTextSecondary
                                                FontWeight: =FontWeight.Normal
                                                Height: =20
                                                Size: =12
                                                Text: =Text(Coalesce(ThisItem.'Total Cost', 0), "#,##0.00")
                                                Width: =112
                                                X: =Parent.TemplateWidth - 120
                                                Y: =30
                                          - ApLnDivider:
                                              Control: Rectangle@2.3.0
                                              Properties:
                                                Fill: =clrStroke
                                                Height: =1
                                                Width: =Parent.TemplateWidth
                                                Y: =Parent.TemplateHeight - 1
                                    - ApComment:
                                        Control: ModernTextInput@1.1.2
                                        Properties:
                                          AccessibleLabel: ="Approver comment"
                                          FillPortions: =0
                                          Height: =64
                                          MaxLength: =1000
                                          Placeholder: ="Comment for the requester (required to reject)"
                                          TriggerOutput: =TriggerOutput.Keypress
                                          Type: =TextInputType.Multiline
                                          Visible: =Text(gApprOrder.'Order Status') = "Submitted"
                                    - ApDecide:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =40
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          Visible: =Text(gApprOrder.'Order Status') = "Submitted"
                                        Children:
                                          - ApDecideSpacer:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                DropShadow: =DropShadow.None
                                                Fill: =Color.Transparent
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =8
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                          - ApReject:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                Appearance: =ButtonAppearance.Outline
                                                FillPortions: =0
                                                Height: =36
                                                Icon: ="DismissCircle"
                                                OnSelect: |-
                                                  =If(IsBlank(ApComment.Text), Notify("Add a comment explaining why you are rejecting it.", NotificationType.Error), UpdateContext({locBusy: true});
                                                  IfError(
                                                      Patch('Supply Orders', gApprOrder, {
                                                          'Approval Status': [@'Approval Status'].Rejected,
                                                          'Order Status': [@'Order Status'].Rejected,
                                                          'Approval Date': Now(),
                                                          'Approved By': User().FullName,
                                                          'Approver Comments': ApComment.Text
                                                      });
                                                      Patch('Approval History Records', Defaults('Approval History Records'), {
                                                          'Approval Record': "Rejected - " & gApprOrder.'Order Number',
                                                          'Supply Order': gApprOrder,
                                                          Action: [@'Approval Action'].Rejected,
                                                          Approver: User().FullName,
                                                          'Action Date': Now(),
                                                          Comments: ApComment.Text,
                                                          'Previous Status': [@'Approval Status'].Pending,
                                                          'New Status': [@'Approval Status'].Rejected
                                                      });
                                                      Notify(gApprOrder.'Order Number' & " rejected.", NotificationType.Success);
                                                      Set(gApprOrder, Blank());
                                                      Reset(ApComment),
                                                      Notify("Something went wrong: " & FirstError.Message, NotificationType.Error)
                                                  );
                                                  UpdateContext({locBusy: false}))
                                                Text: ="Reject"
                                                Width: =130
                                          - ApApprove:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                Appearance: =ButtonAppearance.Primary
                                                FillPortions: =0
                                                Height: =36
                                                Icon: ="CheckmarkCircle"
                                                OnSelect: |-
                                                  =UpdateContext({locBusy: true});
                                                  IfError(
                                                      Patch('Supply Orders', gApprOrder, {
                                                          'Approval Status': [@'Approval Status'].Approved,
                                                          'Order Status': [@'Order Status'].Approved,
                                                          'Approval Date': Now(),
                                                          'Approved By': User().FullName,
                                                          'Approver Comments': ApComment.Text
                                                      });
                                                      Patch('Approval History Records', Defaults('Approval History Records'), {
                                                          'Approval Record': "Approved - " & gApprOrder.'Order Number',
                                                          'Supply Order': gApprOrder,
                                                          Action: [@'Approval Action'].Approved,
                                                          Approver: User().FullName,
                                                          'Action Date': Now(),
                                                          Comments: ApComment.Text,
                                                          'Previous Status': [@'Approval Status'].Pending,
                                                          'New Status': [@'Approval Status'].Approved
                                                      });
                                                      Notify(gApprOrder.'Order Number' & " approved.", NotificationType.Success);
                                                      Set(gApprOrder, Blank());
                                                      Reset(ApComment),
                                                      Notify("Something went wrong: " & FirstError.Message, NotificationType.Error)
                                                  );
                                                  UpdateContext({locBusy: false})
                                                Text: ="Approve"
                                                Width: =150
                              - ApDetailEmpty:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =80
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    Visible: =IsBlank(gApprOrder)
                                  Children:
                                    - ApDetailEmptyIcon:
                                        Control: ModernIcon@1.1.1
                                        Properties:
                                          FillPortions: =0
                                          Height: =28
                                          Icon: ="DocumentBulletList"
                                          IconColor: =clrTextTertiary
                                          Width: =28
                                    - ApDetailEmptyText:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =clrTextSecondary
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Normal
                                          Height: =40
                                          Size: =13
                                          Text: ="Select a request to review it."
      - ApBusy:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.35)
            Height: =Parent.Height
            Visible: =locBusy
            Width: =Parent.Width
          Children:
            - ApBusyCard:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =clrSurface
                  Height: =120
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =280
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - ApBusySpinner:
                      Control: ModernSpinner@1.1.0
                      Properties:
                        Height: =80
                        Label: ="Working on it..."
                        LabelPosition: =SpinnerLabelPosition.Below
                        Width: =240
                        X: =20
                        Y: =20
