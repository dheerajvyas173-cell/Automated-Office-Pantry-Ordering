Screens:
  NewOrderScreen:
    Properties:
      Fill: =clrCanvas
    Children:
      - NoRoot:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =clrCanvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - NoNavRail:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =clrSurface
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  Width: =If(App.Width < 900, 72, 232)
                Children:
                  - NoBrand:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                      Children:
                        - NoBrandIcon:
                            Control: ModernIcon@1.1.0
                            Properties:
                              Height: =28
                              Icon: ="FoodPizza"
                              IconColor: =clrBrand
                              IconStyle: =IconStyle.Filled
                              Width: =28
                        - NoBrandName:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =clrTextPrimary
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              Size: =16
                              Text: ="Office Pantry"
                              Visible: =App.Width >= 900
                  - NoNavHome:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Dashboard"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =40
                        Icon: ="Home"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(HomeScreen, ScreenTransition.None)
                        Text: ="Dashboard"
                        Tooltip: ="Dashboard"
                  - NoNavNewOrder:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="New request"
                        Appearance: =ButtonAppearance.Secondary
                        Height: =40
                        Icon: ="Add"
                        IconStyle: =IconStyle.Filled
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(NewOrderScreen, ScreenTransition.None)
                        Text: ="New request" & If(CountRows(colCart) > 0, " (" & CountRows(colCart) & ")", "")
                        Tooltip: ="New request"
                  - NoNavMyOrders:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="My requests"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =40
                        Icon: ="DocumentBulletList"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(MyOrdersScreen, ScreenTransition.None)
                        Text: ="My requests"
                        Tooltip: ="My requests"
                  - NoNavInventory:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Inventory"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =40
                        Icon: ="Box"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(InventoryScreen, ScreenTransition.None)
                        Text: ="Inventory"
                        Tooltip: ="Inventory"
                  - NoNavSpacer:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                  - NoUserRow:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                      Children:
                        - NoUserAvatar:
                            Control: ModernAvatar@1.0.0
                            Properties:
                              Height: =32
                              Image: =User().Image
                              Name: =User().FullName
                              Shape: =AvatarShape.Circular
                              Tooltip: =User().FullName
                              Width: =32
                        - NoUserName:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =clrTextPrimary
                              FillPortions: =1
                              FontWeight: =FontWeight.Normal
                              Height: =32
                              Size: =13
                              Text: =User().FullName
                              VerticalAlign: =VerticalAlign.Middle
                              Visible: =App.Width >= 900
            - NoMain:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                Children:
                  - NoHeader:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                      Children:
                        - NoTitleBlock:
                            Control: GroupContainer@1.4.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                            Children:
                              - NoTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    Size: =24
                                    Text: ="New request"
                              - NoSubtitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextSecondary
                                    FontWeight: =FontWeight.Normal
                                    Height: =22
                                    Size: =14
                                    Text: ="Pick the supplies you need. Your approver is notified when you submit."
                        - NoActions:
                            Control: GroupContainer@1.4.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Width: =150
                            Children:
                              - NoClear:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Subtle
                                    DisplayMode: =If(IsEmpty(colCart), DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =36
                                    Icon: ="Dismiss"
                                    OnSelect: =Clear(colCart)
                                    Text: ="Clear request"
                                    Width: =150
                  - NoBody:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                      Children:
                        - NoCatalog:
                            Control: GroupContainer@1.4.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =clrStroke
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =clrSurface
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinWidth: =420
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                            Children:
                              - NoCatalogTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    Size: =16
                                    Text: ="1. Choose items"
                              - NoToolbar:
                                  Control: GroupContainer@1.4.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =36
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                  Children:
                                    - NoSearch:
                                        Control: ModernTextInput@1.0.0
                                        Properties:
                                          AccessibleLabel: ="Search items"
                                          FillPortions: =1
                                          Height: =36
                                          Placeholder: ="Search items"
                                          TriggerOutput: =TriggerOutput.Delayed
                                          Type: =TextInputType.Search
                                    - NoCategory:
                                        Control: ModernCombobox@1.0.0
                                        Properties:
                                          AccessibleLabel: ="Filter by category"
                                          Height: =36
                                          InputTextPlaceholder: ="All categories"
                                          Items: =Choices([@'Item Category'])
                                          SelectMultiple: =false
                                          Width: =220
                              - NoItems:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                                  Properties:
                                    BorderThickness: =0
                                    Fill: =Color.Transparent
                                    FillPortions: =1
                                    Items: =Sort(Filter(colItems, (IsBlank(NoSearch.Text) || StartsWith('Item Name', NoSearch.Text)) && (IsBlank(NoCategory.Selected) || Category = NoCategory.Selected.Value)), 'Item Name')
                                    LayoutMinHeight: =120
                                    ShowScrollbar: =true
                                    TemplatePadding: =0
                                    TemplateSize: =72
                                  Children:
                                    - NoItName:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextPrimary
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =14
                                          Text: =ThisItem.'Item Name'
                                          Width: =Parent.TemplateWidth - 380
                                          X: =8
                                          Y: =10
                                    - NoItMeta:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextSecondary
                                          FontWeight: =FontWeight.Normal
                                          Height: =20
                                          Size: =12
                                          Text: =Text(ThisItem.Category) & "  ·  " & Text(ThisItem.'Unit of Measure') & "  ·  " & Text(Coalesce(ThisItem.'Unit Price', 0), "#,##0.00")
                                          Width: =Parent.TemplateWidth - 380
                                          X: =8
                                          Y: =36
                                    - NoItStock:
                                        Control: ModernBadge@1.0.0
                                        Properties:
                                          Appearance: =BadgeAppearance.Tint
                                          Content: =If(ThisItem.'Current Stock' <= 0, "Out of stock", ThisItem.'Current Stock' <= ThisItem.'Minimum Stock Level', "Low stock", "In stock") & " (" & Coalesce(ThisItem.'Current Stock', 0) & ")"
                                          Height: =24
                                          Intent: =If(ThisItem.'Current Stock' <= 0, BadgeIntent.Critical, ThisItem.'Current Stock' <= ThisItem.'Minimum Stock Level', BadgeIntent.Caution, BadgeIntent.Positive)
                                          Shape: =BadgeShape.Rounded
                                          Width: =130
                                          X: =Parent.TemplateWidth - 364
                                          Y: =24
                                    - NoItQty:
                                        Control: ModernNumberInput@1.0.0
                                        Properties:
                                          AccessibleLabel: ="Quantity of " & ThisItem.'Item Name'
                                          Default: =1
                                          Height: =36
                                          Max: =999
                                          Min: =1
                                          Precision: =DecimalPrecision.'0'
                                          Step: =1
                                          Width: =96
                                          X: =Parent.TemplateWidth - 222
                                          Y: =18
                                    - NoItAdd:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Height: =36
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =With({existing: LookUp(colCart, Item.'Pantry Item' = ThisItem.'Pantry Item'), qty: NoItQty.Value},
                                                If(IsBlank(existing),
                                                    Collect(colCart, {Item: ThisItem, Qty: qty}),
                                                    Patch(colCart, existing, {Qty: existing.Qty + qty})
                                                )
                                            );
                                            If(ThisItem.'Current Stock' > ThisItem.'Minimum Stock Level',
                                                Notify(ThisItem.'Item Name' & " added. Note: the pantry still has " & ThisItem.'Current Stock' & " in stock.", NotificationType.Warning),
                                                Notify(ThisItem.'Item Name' & " added to your request.", NotificationType.Success)
                                            )
                                          Text: ="Add"
                                          Width: =104
                                          X: =Parent.TemplateWidth - 116
                                          Y: =18
                                    - NoItDivider:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =clrStroke
                                          Height: =1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                              - NoItemsEmpty:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =clrTextSecondary
                                    FontWeight: =FontWeight.Normal
                                    Height: =48
                                    Size: =13
                                    Text: ="No items match your search."
                                    Visible: =IsEmpty(NoItems.AllItems)
                        - NoCart:
                            Control: GroupContainer@1.4.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =clrStroke
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =clrSurface
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =If(App.Width < 1200, 340, 400)
                            Children:
                              - NoCartHead:
                                  Control: GroupContainer@1.4.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                  Children:
                                    - NoCartTitle:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextPrimary
                                          FontWeight: =FontWeight.Semibold
                                          Height: =28
                                          Size: =16
                                          Text: ="2. Your request"
                                    - NoCartSpacer:
                                        Control: GroupContainer@1.4.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =1
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                    - NoCartCount:
                                        Control: ModernBadge@1.0.0
                                        Properties:
                                          Appearance: =BadgeAppearance.Tint
                                          Content: =CountRows(colCart) & If(CountRows(colCart) = 1, " item", " items")
                                          Height: =24
                                          Intent: =BadgeIntent.Informative
                                          Shape: =BadgeShape.Rounded
                                          Width: =80
                              - NoCartEmpty:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =clrTextSecondary
                                    FontWeight: =FontWeight.Normal
                                    Height: =48
                                    Size: =13
                                    Text: ="Add items from the catalog to start a request."
                                    Visible: =IsEmpty(colCart)
                              - NoCartList:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                                  Properties:
                                    BorderThickness: =0
                                    Fill: =Color.Transparent
                                    FillPortions: =1
                                    Items: =colCart
                                    LayoutMinHeight: =112
                                    ShowScrollbar: =true
                                    TemplatePadding: =0
                                    TemplateSize: =56
                                    Visible: =!IsEmpty(colCart)
                                  Children:
                                    - NoCtName:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextPrimary
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =13
                                          Text: =ThisItem.Item.'Item Name'
                                          Width: =Parent.TemplateWidth - 150
                                          X: =4
                                          Y: =6
                                    - NoCtLine:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextSecondary
                                          FontWeight: =FontWeight.Normal
                                          Height: =20
                                          Size: =12
                                          Text: =Text(ThisItem.Qty * Coalesce(ThisItem.Item.'Unit Price', 0), "#,##0.00")
                                          Width: =Parent.TemplateWidth - 150
                                          X: =4
                                          Y: =30
                                    - NoCtQty:
                                        Control: ModernNumberInput@1.0.0
                                        Properties:
                                          AccessibleLabel: ="Quantity of " & ThisItem.Item.'Item Name'
                                          Default: =ThisItem.Qty
                                          Height: =36
                                          Max: =999
                                          Min: =1
                                          OnChange: |-
                                            =Patch(colCart, ThisItem, {Qty: Self.Value})
                                          Precision: =DecimalPrecision.'0'
                                          Step: =1
                                          Width: =88
                                          X: =Parent.TemplateWidth - 140
                                          Y: =10
                                    - NoCtRemove:
                                        Control: ModernIcon@1.1.0
                                        Properties:
                                          AccessibleLabel: ="Remove " & ThisItem.Item.'Item Name'
                                          Height: =24
                                          Icon: ="Delete"
                                          IconColor: =clrDanger
                                          OnSelect: =Remove(colCart, ThisItem)
                                          Tooltip: ="Remove"
                                          Width: =24
                                          X: =Parent.TemplateWidth - 40
                                          Y: =16
                                    - NoCtDivider:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =clrStroke
                                          Height: =1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                              - NoTotalRow:
                                  Control: GroupContainer@1.4.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =28
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                  Children:
                                    - NoTotalLabel:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =clrTextPrimary
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =14
                                          Text: ="Estimated total"
                                    - NoTotalValue:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Right
                                          Color: =clrTextPrimary
                                          FontWeight: =FontWeight.Semibold
                                          Height: =25
                                          Size: =16
                                          Text: =Text(Sum(colCart, Qty * Coalesce(Item.'Unit Price', 0)), "#,##0.00")
                                          Width: =140
                              - NoRequiredByLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =13
                                    Text: ="Required by"
                              - NoRequiredBy:
                                  Control: ModernDatePicker@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Required by date"
                                    DefaultDate: =DateAdd(Today(), 3, TimeUnit.Days)
                                    Height: =36
                                    Placeholder: ="Select a date"
                                    StartDate: =Today()
                              - NoLocationLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =13
                                    Text: ="Delivery location"
                              - NoLocation:
                                  Control: ModernTextInput@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Delivery location"
                                    Height: =36
                                    Placeholder: |-
                                      ="For example: 3rd floor pantry"
                              - NoJustificationLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =13
                                    Text: ="Justification (optional)"
                              - NoJustification:
                                  Control: ModernTextInput@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Justification"
                                    Height: =72
                                    MaxLength: =1000
                                    Placeholder: ="Why is this needed?"
                                    TriggerOutput: =TriggerOutput.FocusOut
                                    Type: =TextInputType.Multiline
                              - NoSubmit:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Primary
                                    DisplayMode: =If(IsEmpty(colCart) || locBusy, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =40
                                    Icon: ="Send"
                                    OnSelect: |-
                                      =If(IsBlank(NoRequiredBy.SelectedDate),
                                          Notify("Choose a required-by date.", NotificationType.Error),
                                          UpdateContext({locBusy: true});
                                          IfError(
                                              Set(gNewOrder, Patch('Supply Orders', Defaults('Supply Orders'), {
                                                  'Order Number': "PO-" & Text(Now(), "yyyymmdd-hhmmss"),
                                                  'Order Status': [@'Order Status'].Draft,
                                                  'Required By Date': NoRequiredBy.SelectedDate,
                                                  Justification: NoJustification.Text,
                                                  'Delivery Address': NoLocation.Text,
                                                  'Requested By': gUserEmail,
                                                  'Total Amount': Sum(colCart, Qty * Coalesce(Item.'Unit Price', 0))
                                              }));
                                              Collect('Order Line Items', ForAll(colCart As L, {
                                                  'Line Item Name': L.Item.'Item Name',
                                                  'Supply Order': gNewOrder,
                                                  'Pantry Item': L.Item,
                                                  Supplier: L.Item.'Preferred Supplier',
                                                  Quantity: L.Qty,
                                                  'Unit Price': L.Item.'Unit Price',
                                                  'Total Cost': L.Qty * Coalesce(L.Item.'Unit Price', 0)
                                              }));
                                              Patch('Supply Orders', gNewOrder, {'Order Status': [@'Order Status'].Submitted});
                                              Notify("Request " & gNewOrder.'Order Number' & " submitted for approval.", NotificationType.Success);
                                              Clear(colCart);
                                              Reset(NoJustification);
                                              Reset(NoLocation);
                                              Set(gSelOrder, gNewOrder);
                                              UpdateContext({locBusy: false});
                                              Navigate(MyOrdersScreen, ScreenTransition.None),
                                              UpdateContext({locBusy: false});
                                              Notify("Your request couldn't be submitted: " & FirstError.Message, NotificationType.Error)
                                          )
                                      )
                                    Text: ="Submit for approval"
      - NoBusy:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.35)
            Height: =Parent.Height
            Visible: =locBusy
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - NoBusyCard:
                Control: GroupContainer@1.4.0
                Variant: ManualLayout
                Properties:
                  Fill: =clrSurface
                  Height: =120
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =280
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - NoBusySpinner:
                      Control: ModernSpinner@1.1.0
                      Properties:
                        Height: =80
                        Label: ="Saving your request..."
                        LabelPosition: =SpinnerLabelPosition.Below
                        Width: =240
                        X: =20
                        Y: =20
