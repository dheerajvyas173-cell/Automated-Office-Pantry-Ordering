Screens:
  NewOrderScreen:
    Properties:
      Fill: =clrCanvas
    Children:
      - NoRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =clrCanvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - NoNavRail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =clrSurface
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  Width: =If(App.Width < 900, 72, 240)
                Children:
                  - NoBrand:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                      Children:
                        - NoBrandTile:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Fill: =clrBrand
                              FillPortions: =0
                              Height: =40
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =40
                            Children:
                              - NoBrandIcon:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    AccessibleLabel: ="food pizza icon"
                                    Height: =22
                                    Icon: ="FoodPizza"
                                    IconColor: =Color.White
                                    IconStyle: =IconStyle.Filled
                                    Width: =22
                                    X: =9
                                    Y: =9
                        - NoBrandText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinWidth: =0
                              Visible: =App.Width >= 900
                            Children:
                              - NoBrandName:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Size: =15
                                    Text: ="Office Pantry"
                                    Wrap: =false
                              - NoBrandSub:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =clrTextSecondary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Normal
                                    Height: =16
                                    Size: =11
                                    Text: ="Supply ordering"
                                    Wrap: =false
                  - NoNavGap:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =8
                        TabIndex: =-1
                  - NoNavHome:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Dashboard"
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="Home"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(HomeScreen, ScreenTransition.None)
                        Text: ="Dashboard"
                        Tooltip: ="Dashboard"
                        Width: =If(App.Width < 900, 48, 216)
                  - NoNavNewOrder:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="New request"
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: =ButtonAppearance.Secondary
                        FillPortions: =0
                        Height: =40
                        Icon: ="Add"
                        IconStyle: =IconStyle.Filled
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(NewOrderScreen, ScreenTransition.None)
                        Text: ="New request" & If(CountRows(colCart) > 0, " (" & CountRows(colCart) & ")", "")
                        Tooltip: ="New request"
                        Width: =If(App.Width < 900, 48, 216)
                  - NoNavMyOrders:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="My requests"
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="DocumentBulletList"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(MyOrdersScreen, ScreenTransition.None)
                        Text: ="My requests"
                        Tooltip: ="My requests"
                        Width: =If(App.Width < 900, 48, 216)
                  - NoNavInventory:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Inventory"
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="Box"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(InventoryScreen, ScreenTransition.None)
                        Text: ="Inventory"
                        Tooltip: ="Inventory"
                        Width: =If(App.Width < 900, 48, 216)
                  - NoNavApprovals:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Approvals"
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="TaskListSquareLtr"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(ApprovalsScreen, ScreenTransition.None)
                        Text: ="Approvals"
                        Tooltip: ="Approvals"
                        Visible: =gRole = "Approver" || gRole = "Pantry Admin"
                        Width: =If(App.Width < 900, 48, 216)
                  - NoNavReceiving:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Receiving"
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="VehicleTruckProfile"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(ReceivingScreen, ScreenTransition.None)
                        Text: ="Receiving"
                        Tooltip: ="Receiving"
                        Visible: =gRole = "Pantry Admin"
                        Width: =If(App.Width < 900, 48, 216)
                  - NoNavSpacer:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                  - NoRoleBox:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =clrCanvas
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Visible: =App.Width >= 900
                      Children:
                        - NoRoleCaption:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =clrTextSecondary
                              FillPortions: =0
                              FontWeight: =FontWeight.Semibold
                              Height: =16
                              Size: =11
                              Text: ="Viewing as"
                        - NoRole:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: ="Switch role"
                              DefaultSelectedItems: =[gRole]
                              FillPortions: =0
                              Height: =36
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =["Requester", "Approver", "Pantry Admin"]
                              OnChange: =Set(gRole, Coalesce(Self.Selected.Value, gRole))
                              SelectMultiple: =false
                  - NoUserRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                      Children:
                        - NoUserAvatar:
                            Control: ModernAvatar@1.1.0
                            Properties:
                              AccessibleLabel: =User().FullName
                              FillPortions: =0
                              Height: =32
                              Tooltip: =User().FullName
                              Width: =32
                        - NoUserText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinWidth: =0
                              Visible: =App.Width >= 900
                            Children:
                              - NoUserName:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =13
                                    Text: =User().FullName
                                    Wrap: =false
                              - NoUserRoleText:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =clrTextSecondary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Normal
                                    Height: =16
                                    Size: =11
                                    Text: =gRole
                                    Wrap: =false
            - NoMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinWidth: =0
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                Children:
                  - NoHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                      Children:
                        - NoTitleBlock:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              Height: =62
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinWidth: =0
                            Children:
                              - NoTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    Size: =26
                                    Text: ="New request"
                                    Wrap: =false
                              - NoSubtitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =clrTextSecondary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Normal
                                    Height: =22
                                    Size: =14
                                    Text: ="Pick the supplies that are running low. Small orders are approved automatically."
                                    Wrap: =false
                        - NoActions:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              Width: =164
                            Children:
                              - NoClear:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Clear request"
                                    Appearance: =ButtonAppearance.Subtle
                                    DisplayMode: =If(IsEmpty(colCart), DisplayMode.Disabled, DisplayMode.Edit)
                                    FillPortions: =0
                                    Height: =36
                                    Icon: ="Dismiss"
                                    OnSelect: =Clear(colCart)
                                    Text: ="Clear request"
                                    Width: =164
                  - NoBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMinHeight: =0
                      Children:
                        - NoCatalog:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =clrStroke
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =clrSurface
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinWidth: =440
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - NoCatHead:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =36
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - NoCatHeadIcon:
                                        Control: ModernIcon@1.1.1
                                        Properties:
                                          AccessibleLabel: ="box icon"
                                          FillPortions: =0
                                          Height: =20
                                          Icon: ="Box"
                                          IconColor: =clrBrand
                                          IconStyle: =IconStyle.Filled
                                          Width: =20
                                    - NoCatHeadTitle:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =clrTextPrimary
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Height: =28
                                          LayoutMinWidth: =0
                                          Size: =16
                                          Text: ="1. Choose items"
                                    - NoView:
                                        Control: ModernTabList@1.0.2
                                        Properties:
                                          AccessibleLabel: ="Show items that need restocking or all items"
                                          Alignment: =TabListAlignment.Start
                                          Appearance: =TabListAppearance.SubtleCircular
                                          FillPortions: =0
                                          Height: =36
                                          Items: =["Needs restock", "All items"]
                                          Width: =260
                              - NoStockNote:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =clrBrandTint
                                    FillPortions: =0
                                    Height: =52
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                  Children:
                                    - NoStockNoteIcon:
                                        Control: ModernIcon@1.1.1
                                        Properties:
                                          AccessibleLabel: ="Note"
                                          FillPortions: =0
                                          Height: =20
                                          Icon: ="Info"
                                          IconColor: =clrBrand
                                          IconStyle: =IconStyle.Filled
                                          Width: =20
                                    - NoStockNoteText:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =clrTextPrimary
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Normal
                                          Height: =36
                                          LayoutMinWidth: =0
                                          Size: =13
                                          Text: |-
                                            =If(gRole = "Pantry Admin", "Inventory check: well-stocked items are blocked for staff. As pantry admin you can still add them.", "Inventory check: only items at or below their minimum stock level can be requested.")
                                          VerticalAlign: =VerticalAlign.Middle
                              - NoToolbar:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =36
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - NoSearch:
                                        Control: ModernTextInput@1.1.2
                                        Properties:
                                          AccessibleLabel: ="Search items"
                                          FillPortions: =1
                                          Height: =36
                                          LayoutMinWidth: =120
                                          Placeholder: ="Search items"
                                          TriggerOutput: =TriggerOutput.Delayed
                                          Type: =TextInputType.Search
                                    - NoCategory:
                                        Control: ModernCombobox@1.1.2
                                        Properties:
                                          AccessibleLabel: ="Filter by category"
                                          FillPortions: =0
                                          Height: =36
                                          InputTextPlaceholder: ="All categories"
                                          ItemDisplayText: =ThisItem.Value
                                          Items: =Choices('Pantry Items'.Category)
                                          SelectMultiple: =false
                                          Width: =220
                              - NoItems:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                                  Properties:
                                    AccessibleLabel: ="Items list"
                                    Fill: =Color.Transparent
                                    FillPortions: =1
                                    Items: =Sort(Filter(colItems, (IsBlank(NoSearch.Text) || StartsWith(Title, NoSearch.Text)) && (IsBlank(NoCategory.Selected) || Category.Value = NoCategory.Selected.Value) && (NoView.Selected.Value = "All items" || 'Current Stock' <= 'Minimum Stock Level')), Title)
                                    LayoutMinHeight: =100
                                    TemplateSize: =76
                                  Children:
                                    - NoItName:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =clrTextPrimary
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Size: =14
                                          Text: =ThisItem.Title
                                          Width: =Parent.TemplateWidth - 390
                                          Wrap: =false
                                          X: =4
                                          Y: =12
                                    - NoItMeta:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =clrTextSecondary
                                          FontWeight: =FontWeight.Normal
                                          Height: =20
                                          Size: =12
                                          Text: =ThisItem.Category.Value & "  ·  " & ThisItem.'Unit of Measure'.Value & "  ·  " & Text(Coalesce(ThisItem.'Unit Price', 0), "#,##0.00")
                                          Width: =Parent.TemplateWidth - 390
                                          Wrap: =false
                                          X: =4
                                          Y: =40
                                    - NoItStock:
                                        Control: ModernBadge@1.0.0
                                        Properties:
                                          AccessibleLabel: =If(ThisItem.'Current Stock' <= 0, "Out of stock", ThisItem.'Current Stock' <= ThisItem.'Minimum Stock Level', "Low stock", "Well stocked") & " · " & Coalesce(ThisItem.'Current Stock', 0)
                                          Content: =If(ThisItem.'Current Stock' <= 0, "Out of stock", ThisItem.'Current Stock' <= ThisItem.'Minimum Stock Level', "Low stock", "Well stocked") & " · " & Coalesce(ThisItem.'Current Stock', 0)
                                          Height: =24
                                          Intent: =If(ThisItem.'Current Stock' <= 0, BadgeIntent.Critical, ThisItem.'Current Stock' <= ThisItem.'Minimum Stock Level', BadgeIntent.Caution, BadgeIntent.Positive)
                                          Shape: =BadgeShape.Rounded
                                          Width: =136
                                          X: =Parent.TemplateWidth - 376
                                          Y: =26
                                    - NoItQty:
                                        Control: ModernNumberInput@1.1.2
                                        Properties:
                                          AccessibleLabel: ="Quantity of " & ThisItem.Title
                                          Default: =Coalesce(ThisItem.'Reorder Quantity', 1)
                                          DisplayMode: =If((gRole = "Pantry Admin" || ThisItem.'Current Stock' <= ThisItem.'Minimum Stock Level'), DisplayMode.Edit, DisplayMode.Disabled)
                                          Height: =36
                                          Max: =999
                                          Min: =1
                                          Precision: =DecimalPrecision.'0'
                                          Step: =1
                                          Width: =96
                                          X: =Parent.TemplateWidth - 228
                                          Y: =20
                                    - NoItAdd:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          AccessibleLabel: ="Add"
                                          Appearance: =ButtonAppearance.Outline
                                          DisplayMode: =If((gRole = "Pantry Admin" || ThisItem.'Current Stock' <= ThisItem.'Minimum Stock Level'), DisplayMode.Edit, DisplayMode.Disabled)
                                          Height: =36
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =With({existing: LookUp(colCart, Item.ID = ThisItem.ID), qty: NoItQty.Value},
                                                If(IsBlank(existing),
                                                    Collect(colCart, {Item: ThisItem, Qty: qty}),
                                                    Patch(colCart, existing, {Qty: existing.Qty + qty})
                                                )
                                            );
                                            If(ThisItem.'Current Stock' > ThisItem.'Minimum Stock Level',
                                                Notify(ThisItem.Title & " added as a pantry admin override. " & ThisItem.'Current Stock' & " are still in stock.", NotificationType.Warning),
                                                Notify(ThisItem.Title & " added to your request.", NotificationType.Success)
                                            )
                                          Text: ="Add"
                                          Tooltip: |-
                                            =If((gRole = "Pantry Admin" || ThisItem.'Current Stock' <= ThisItem.'Minimum Stock Level'), "Add to your request", "Well stocked: no reorder needed yet")
                                          Width: =112
                                          X: =Parent.TemplateWidth - 120
                                          Y: =20
                                    - NoItDivider:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =clrStroke
                                          Height: =1
                                          TabIndex: =-1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                              - NoItemsEmpty:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =80
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    Visible: =IsEmpty(NoItems.AllItems)
                                  Children:
                                    - NoItemsEmptyIcon:
                                        Control: ModernIcon@1.1.1
                                        Properties:
                                          AccessibleLabel: ="search info icon"
                                          FillPortions: =0
                                          Height: =28
                                          Icon: ="SearchInfo"
                                          IconColor: =clrTextTertiary
                                          Width: =28
                                    - NoItemsEmptyText:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          AutoHeight: =true
                                          Color: =clrTextSecondary
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Normal
                                          Height: =40
                                          Size: =13
                                          Text: ="Nothing to show. Try "All items" or another search."
                        - NoCart:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =clrStroke
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =clrSurface
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =If(App.Width < 1200, 350, 410)
                            Children:
                              - NoCtHead:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =36
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                  Children:
                                    - NoCtHeadIcon:
                                        Control: ModernIcon@1.1.1
                                        Properties:
                                          AccessibleLabel: ="cart icon"
                                          FillPortions: =0
                                          Height: =20
                                          Icon: ="Cart"
                                          IconColor: =clrBrand
                                          IconStyle: =IconStyle.Filled
                                          Width: =20
                                    - NoCtHeadTitle:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =clrTextPrimary
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Height: =28
                                          LayoutMinWidth: =0
                                          Size: =16
                                          Text: ="2. Your request"
                                    - NoCartCount:
                                        Control: ModernBadge@1.0.0
                                        Properties:
                                          AccessibleLabel: =CountRows(colCart) & If(CountRows(colCart) = 1, " item", " items")
                                          Content: =CountRows(colCart) & If(CountRows(colCart) = 1, " item", " items")
                                          FillPortions: =0
                                          Height: =24
                                          Intent: =BadgeIntent.Informative
                                          Shape: =BadgeShape.Rounded
                                          Width: =80
                              - NoCartEmpty:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =80
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    Visible: =IsEmpty(colCart)
                                  Children:
                                    - NoCartEmptyIcon:
                                        Control: ModernIcon@1.1.1
                                        Properties:
                                          AccessibleLabel: ="cart icon"
                                          FillPortions: =0
                                          Height: =28
                                          Icon: ="Cart"
                                          IconColor: =clrTextTertiary
                                          Width: =28
                                    - NoCartEmptyText:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          AutoHeight: =true
                                          Color: =clrTextSecondary
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Normal
                                          Height: =40
                                          Size: =13
                                          Text: ="Add items from the catalog to start a request."
                              - NoCartList:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                                  Properties:
                                    AccessibleLabel: ="CartList list"
                                    Fill: =Color.Transparent
                                    FillPortions: =1
                                    Items: =colCart
                                    LayoutMinHeight: =120
                                    TemplateSize: =60
                                    Visible: =!IsEmpty(colCart)
                                  Children:
                                    - NoCtName:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =clrTextPrimary
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =13
                                          Text: =ThisItem.Item.Title
                                          Width: =Parent.TemplateWidth - 150
                                          Wrap: =false
                                          X: =4
                                          Y: =8
                                    - NoCtLine:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =clrTextSecondary
                                          FontWeight: =FontWeight.Normal
                                          Height: =20
                                          Size: =12
                                          Text: =Text(ThisItem.Qty * Coalesce(ThisItem.Item.'Unit Price', 0), "#,##0.00")
                                          Width: =Parent.TemplateWidth - 150
                                          Wrap: =false
                                          X: =4
                                          Y: =32
                                    - NoCtQty:
                                        Control: ModernNumberInput@1.1.2
                                        Properties:
                                          AccessibleLabel: ="Quantity of " & ThisItem.Item.Title
                                          Default: =ThisItem.Qty
                                          Height: =36
                                          Max: =999
                                          Min: =1
                                          OnChange: |-
                                            =Patch(colCart, ThisItem, {Qty: Self.Value})
                                          Precision: =DecimalPrecision.'0'
                                          Step: =1
                                          Width: =88
                                          X: =Parent.TemplateWidth - 140
                                          Y: =12
                                    - NoCtRemove:
                                        Control: ModernIcon@1.1.1
                                        Properties:
                                          AccessibleLabel: ="Remove " & ThisItem.Item.Title
                                          Height: =24
                                          Icon: ="Delete"
                                          IconColor: =clrDanger
                                          OnSelect: =Remove(colCart, ThisItem)
                                          Tooltip: ="Remove"
                                          Width: =24
                                          X: =Parent.TemplateWidth - 40
                                          Y: =18
                                    - NoCtDivider:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =clrStroke
                                          Height: =1
                                          TabIndex: =-1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                              - NoTotalRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =clrBrandTint
                                    FillPortions: =0
                                    Height: =32
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                  Children:
                                    - NoTotalLabel:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =clrTextPrimary
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          LayoutMinWidth: =0
                                          Size: =14
                                          Text: ="Estimated total · " & Sum(colCart, Qty) & " units"
                                          Wrap: =false
                                    - NoTotalValue:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Right
                                          AutoHeight: =true
                                          Color: =clrBrand
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Semibold
                                          Height: =28
                                          Size: =18
                                          Text: =Text(Sum(colCart, Qty * Coalesce(Item.'Unit Price', 0)), "#,##0.00")
                                          Width: =150
                              - NoApprovalNote:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =If((Sum(colCart, Qty * Coalesce(Item.'Unit Price', 0)) > cfgBudgetLimit || Sum(colCart, Qty) > cfgQuantityLimit), ColorFade(clrWarning, 0.9), ColorFade(clrSuccess, 0.9))
                                    FillPortions: =0
                                    Height: =52
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Visible: =!IsEmpty(colCart)
                                  Children:
                                    - NoApprovalNoteIcon:
                                        Control: ModernIcon@1.1.1
                                        Properties:
                                          AccessibleLabel: ="Note"
                                          FillPortions: =0
                                          Height: =20
                                          Icon: ="Info"
                                          IconColor: =If((Sum(colCart, Qty * Coalesce(Item.'Unit Price', 0)) > cfgBudgetLimit || Sum(colCart, Qty) > cfgQuantityLimit), clrWarning, clrSuccess)
                                          IconStyle: =IconStyle.Filled
                                          Width: =20
                                    - NoApprovalNoteText:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =clrTextPrimary
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Normal
                                          Height: =36
                                          LayoutMinWidth: =0
                                          Size: =13
                                          Text: |-
                                            =If((Sum(colCart, Qty * Coalesce(Item.'Unit Price', 0)) > cfgBudgetLimit || Sum(colCart, Qty) > cfgQuantityLimit), "Needs office manager approval: over ₹5,000 or 50 units.", "Auto-approved: under ₹5,000 and 50 units. Sent straight to the supplier.")
                                          VerticalAlign: =VerticalAlign.Middle
                              - NoRequiredByLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =13
                                    Text: ="Required by"
                              - NoRequiredBy:
                                  Control: ModernDatePicker@1.0.2
                                  Properties:
                                    AccessibleLabel: ="Required by date"
                                    DefaultDate: =DateAdd(Today(), 3, TimeUnit.Days)
                                    FillPortions: =0
                                    Height: =36
                                    StartDate: =Today()
                              - NoLocationLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =13
                                    Text: ="Delivery location"
                              - NoLocation:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    AccessibleLabel: ="Delivery location"
                                    FillPortions: =0
                                    Height: =36
                                    Placeholder: |-
                                      ="For example: 3rd floor pantry"
                              - NoJustificationLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =13
                                    Text: ="Justification (optional)"
                              - NoJustification:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    AccessibleLabel: ="Justification"
                                    FillPortions: =0
                                    Height: =72
                                    MaxLength: =1000
                                    Placeholder: ="Why is this needed?"
                                    TriggerOutput: =TriggerOutput.FocusOut
                                    Type: =TextInputType.Multiline
                              - NoSubmit:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Submit request"
                                    Appearance: =ButtonAppearance.Primary
                                    DisplayMode: =If(IsEmpty(colCart) || locBusy, DisplayMode.Disabled, DisplayMode.Edit)
                                    FillPortions: =0
                                    Height: =42
                                    Icon: ="Send"
                                    OnSelect: |-
                                      =UpdateContext({locWellStocked: If(gRole = "Pantry Admin", "",
                                          Concat(Filter(colCart As L, With({live: LookUp('Pantry Items', ID = L.Item.ID)},
                                              live.'Current Stock' > live.'Minimum Stock Level')), Item.Title, ", "))});
                                      If(IsBlank(NoRequiredBy.SelectedDate),
                                          Notify("Choose a required-by date.", NotificationType.Error),
                                          !IsBlank(locWellStocked),
                                          Notify("These items are now well stocked, so they can't be requested: " & locWellStocked & ". Remove them to continue.", NotificationType.Error),
                                          UpdateContext({locNeedsApproval: (Sum(colCart, Qty * Coalesce(Item.'Unit Price', 0)) > cfgBudgetLimit || Sum(colCart, Qty) > cfgQuantityLimit)});
                                          UpdateContext({locBusy: true});
                                          IfError(
                                              Set(gNewOrder, Patch('Pantry Orders', Defaults('Pantry Orders'), {
                                                  Title: "PO-" & Text(Now(), "yyyymmdd-hhmmss"),
                                                  'Requester Name': User().FullName,
                                                  'Order Status': {Value: "Draft"},
                                                  'Required By Date': NoRequiredBy.SelectedDate,
                                                  Justification: NoJustification.Text,
                                                  'Delivery Address': NoLocation.Text,
                                                  'Requested By': gUserEmail,
                                                  'Total Amount': Sum(colCart, Qty * Coalesce(Item.'Unit Price', 0))
                                              }));
                                              ForAll(colCart As L,
                                                  With({item: LookUp('Pantry Items', ID = L.Item.ID)},
                                                      Patch('Pantry Order Lines', Defaults('Pantry Order Lines'), {
                                                          Title: item.Title,
                                                          'Supply Order': {Id: gNewOrder.ID, Value: gNewOrder.Title},
                                                          'Pantry Item': {Id: item.ID, Value: item.Title},
                                                          Supplier: If(IsBlank(item.'Preferred Supplier'.Id), Blank(),
                                                              {Id: item.'Preferred Supplier'.Id, Value: item.'Preferred Supplier'.Value}),
                                                          Quantity: L.Qty,
                                                          'Unit Price': item.'Unit Price',
                                                          'Total Cost': L.Qty * Coalesce(item.'Unit Price', 0)
                                                      })
                                                  )
                                              );
                                              Patch('Pantry Orders', gNewOrder, {'Order Status': {Value: "Submitted"}});
                                              Notify("Request " & gNewOrder.Title & If(locNeedsApproval,
                                                  " submitted. It is over the approval limits, so the office manager has been asked to approve it.",
                                                  " submitted. It is under the approval limits, so it will be approved and sent to the supplier automatically."),
                                                  NotificationType.Success);
                                              Clear(colCart);
                                              Reset(NoJustification);
                                              Reset(NoLocation);
                                              Set(gSelOrder, gNewOrder);
                                              UpdateContext({locBusy: false});
                                              Navigate(MyOrdersScreen, ScreenTransition.None),
                                              UpdateContext({locBusy: false});
                                              Notify("Your request couldn't be submitted: " & FirstError.Message, NotificationType.Error)
                                          )
                                      )
                                    Text: ="Submit request"
      - NoBusy:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.35)
            Height: =Parent.Height
            Visible: =locBusy
            Width: =Parent.Width
          Children:
            - NoBusyCard:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =clrSurface
                  Height: =120
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =280
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - NoBusySpinner:
                      Control: ModernSpinner@1.1.0
                      Properties:
                        Height: =80
                        Label: ="Working on it..."
                        LabelPosition: =SpinnerLabelPosition.Below
                        Width: =240
                        X: =20
                        Y: =20
