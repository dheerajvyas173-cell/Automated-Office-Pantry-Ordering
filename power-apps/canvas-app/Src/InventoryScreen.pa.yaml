Screens:
  InventoryScreen:
    Properties:
      Fill: =clrCanvas
    Children:
      - IvRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =clrCanvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            Width: =Parent.Width
          Children:
            - IvNavRail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =clrSurface
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  Width: =If(App.Width < 900, 72, 240)
                Children:
                  - IvBrand:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                      Children:
                        - IvBrandTile:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =clrBrand
                              FillPortions: =0
                              Height: =40
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =40
                            Children:
                              - IvBrandIcon:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =22
                                    Icon: ="FoodPizza"
                                    IconColor: =Color.White
                                    IconStyle: =IconStyle.Filled
                                    Width: =22
                                    X: =9
                                    Y: =9
                        - IvBrandText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinWidth: =0
                              Visible: =App.Width >= 900
                            Children:
                              - IvBrandName:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Size: =15
                                    Text: ="Office Pantry"
                              - IvBrandSub:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextSecondary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Normal
                                    Height: =16
                                    Size: =11
                                    Text: ="Supply ordering"
                  - IvNavGap:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =8
                  - IvNavHome:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Dashboard"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="Home"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(HomeScreen, ScreenTransition.None)
                        Text: ="Dashboard"
                        Tooltip: ="Dashboard"
                  - IvNavNewOrder:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="New request"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="Add"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(NewOrderScreen, ScreenTransition.None)
                        Text: ="New request" & If(CountRows(colCart) > 0, " (" & CountRows(colCart) & ")", "")
                        Tooltip: ="New request"
                  - IvNavMyOrders:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="My requests"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="DocumentBulletList"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(MyOrdersScreen, ScreenTransition.None)
                        Text: ="My requests"
                        Tooltip: ="My requests"
                  - IvNavInventory:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Inventory"
                        Appearance: =ButtonAppearance.Secondary
                        FillPortions: =0
                        Height: =40
                        Icon: ="Box"
                        IconStyle: =IconStyle.Filled
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(InventoryScreen, ScreenTransition.None)
                        Text: ="Inventory"
                        Tooltip: ="Inventory"
                  - IvNavApprovals:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Approvals"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="TaskListSquareLtr"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(ApprovalsScreen, ScreenTransition.None)
                        Text: ="Approvals"
                        Tooltip: ="Approvals"
                        Visible: =gRole = "Approver" || gRole = "Pantry Admin"
                  - IvNavReceiving:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Receiving"
                        Appearance: =ButtonAppearance.Subtle
                        FillPortions: =0
                        Height: =40
                        Icon: ="VehicleTruckProfile"
                        IconStyle: =IconStyle.Outline
                        Layout: =If(App.Width < 900, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                        OnSelect: =Navigate(ReceivingScreen, ScreenTransition.None)
                        Text: ="Receiving"
                        Tooltip: ="Receiving"
                        Visible: =gRole = "Pantry Admin"
                  - IvNavSpacer:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                  - IvRoleBox:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =clrCanvas
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Visible: =App.Width >= 900
                      Children:
                        - IvRoleCaption:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =clrTextSecondary
                              FillPortions: =0
                              FontWeight: =FontWeight.Semibold
                              Height: =16
                              Size: =11
                              Text: ="Viewing as"
                        - IvRole:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: ="Switch role"
                              DefaultSelectedItems: =[gRole]
                              FillPortions: =0
                              Height: =36
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =["Requester", "Approver", "Pantry Admin"]
                              OnChange: =Set(gRole, Coalesce(Self.Selected.Value, gRole))
                              SelectMultiple: =false
                  - IvUserRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                      Children:
                        - IvUserAvatar:
                            Control: ModernAvatar@1.1.0
                            Properties:
                              FillPortions: =0
                              Height: =32
                              Tooltip: =User().FullName
                              Width: =32
                        - IvUserText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinWidth: =0
                              Visible: =App.Width >= 900
                            Children:
                              - IvUserName:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =13
                                    Text: =User().FullName
                              - IvUserRoleText:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextSecondary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Normal
                                    Height: =16
                                    Size: =11
                                    Text: =gRole
            - IvMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinWidth: =0
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                Children:
                  - IvHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                      Children:
                        - IvTitleBlock:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinWidth: =0
                            Children:
                              - IvTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextPrimary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    Size: =26
                                    Text: ="Inventory"
                              - IvSubtitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextSecondary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Normal
                                    Height: =22
                                    Size: =14
                                    Text: =If(gRole = "Pantry Admin", "Update stock counts and request anything that is running low.", "Current stock for every pantry item. Request anything that is running low.")
                        - IvActions:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              Width: =120
                            Children:
                              - IvRefresh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Subtle
                                    FillPortions: =0
                                    Height: =36
                                    Icon: ="ArrowClockwise"
                                    OnSelect: =Refresh('Pantry Items'); ClearCollect(colItems, Sort('Pantry Items', 'Item Name'))
                                    Text: ="Refresh"
                                    Width: =120
                  - IvToolbar:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                      Children:
                        - IvTabs:
                            Control: ModernTabList@1.0.2
                            Properties:
                              AccessibleLabel: ="Filter by stock level"
                              Alignment: =TabListAlignment.Start
                              Appearance: =TabListAppearance.SubtleCircular
                              FillPortions: =0
                              Height: =40
                              Items: =["All", "Low stock", "Out of stock"]
                              Width: =360
                        - IvToolbarSpacer:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                        - IvSearch:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: ="Search inventory"
                              FillPortions: =0
                              Height: =36
                              Placeholder: ="Search by name or SKU"
                              TriggerOutput: =TriggerOutput.Delayed
                              Type: =TextInputType.Search
                              Width: =280
                        - IvCategory:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: ="Filter by category"
                              FillPortions: =0
                              Height: =36
                              InputTextPlaceholder: ="All categories"
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices('Item Category')
                              SelectMultiple: =false
                              Width: =220
                  - IvTable:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =clrStroke
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =clrSurface
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - IvHeaderRow:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =clrCanvas
                              FillPortions: =0
                              Height: =40
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                            Children:
                              - IvHItem:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Left
                                    Color: =clrTextSecondary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =12
                                    Text: ="Item"
                                    Width: =(Parent.Width - 256) * 0.3 - 8
                                    X: =(Parent.Width - 256) * 0.0 + 12
                                    Y: =10
                              - IvHCat:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Left
                                    Color: =clrTextSecondary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =12
                                    Text: ="Category"
                                    Width: =(Parent.Width - 256) * 0.18 - 8
                                    X: =(Parent.Width - 256) * 0.3 + 12
                                    Y: =10
                              - IvHStock:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Right
                                    Color: =clrTextSecondary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =12
                                    Text: ="In stock"
                                    Width: =(Parent.Width - 256) * 0.11 - 8
                                    X: =(Parent.Width - 256) * 0.48 + 12
                                    Y: =10
                              - IvHMin:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Right
                                    Color: =clrTextSecondary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =12
                                    Text: ="Minimum"
                                    Width: =(Parent.Width - 256) * 0.11 - 8
                                    X: =(Parent.Width - 256) * 0.59 + 12
                                    Y: =10
                              - IvHPrice:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Right
                                    Color: =clrTextSecondary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =12
                                    Text: ="Unit price"
                                    Width: =(Parent.Width - 256) * 0.13 - 8
                                    X: =(Parent.Width - 256) * 0.7 + 12
                                    Y: =10
                              - IvHLoc:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Left
                                    Color: =clrTextSecondary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =12
                                    Text: ="Location"
                                    Width: =(Parent.Width - 256) * 0.17 - 8
                                    X: =(Parent.Width - 256) * 0.83 + 12
                                    Y: =10
                              - IvHStatus:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =clrTextSecondary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =12
                                    Text: ="Status"
                                    Width: =110
                                    X: =Parent.Width - 244
                                    Y: =10
                        - IvRows:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
                            Properties:
                              Fill: =Color.Transparent
                              FillPortions: =1
                              Items: =Sort(Filter(colItems, (IsBlank(IvSearch.Text) || StartsWith('Item Name', IvSearch.Text) || StartsWith(SKU, IvSearch.Text)) && (IsBlank(IvCategory.Selected) || Category = IvCategory.Selected.Value) && Switch(IvTabs.Selected.Value, "Low stock", 'Current Stock' <= 'Minimum Stock Level', "Out of stock", 'Current Stock' <= 0, true)), 'Item Name')
                              LayoutMinHeight: =100
                              TemplateSize: =56
                            Children:
                              - IvCItem:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Left
                                    Color: =clrTextPrimary
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    Size: =13
                                    Text: =ThisItem.'Item Name'
                                    Width: =(Parent.TemplateWidth - 256) * 0.3 - 8
                                    X: =(Parent.TemplateWidth - 256) * 0.0 + 12
                                    Y: =16
                              - IvCCat:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Left
                                    Color: =clrTextPrimary
                                    FontWeight: =FontWeight.Normal
                                    Height: =24
                                    Size: =13
                                    Text: =Text(ThisItem.Category)
                                    Width: =(Parent.TemplateWidth - 256) * 0.18 - 8
                                    X: =(Parent.TemplateWidth - 256) * 0.3 + 12
                                    Y: =16
                              - IvCStock:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Right
                                    Color: =clrTextPrimary
                                    FontWeight: =FontWeight.Normal
                                    Height: =24
                                    Size: =13
                                    Text: =Coalesce(ThisItem.'Current Stock', 0)
                                    Visible: =!(gRole = "Pantry Admin")
                                    Width: =(Parent.TemplateWidth - 256) * 0.11 - 8
                                    X: =(Parent.TemplateWidth - 256) * 0.48 + 12
                                    Y: =16
                              - IvCMin:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Right
                                    Color: =clrTextPrimary
                                    FontWeight: =FontWeight.Normal
                                    Height: =24
                                    Size: =13
                                    Text: =Coalesce(ThisItem.'Minimum Stock Level', 0)
                                    Width: =(Parent.TemplateWidth - 256) * 0.11 - 8
                                    X: =(Parent.TemplateWidth - 256) * 0.59 + 12
                                    Y: =16
                              - IvCPrice:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Right
                                    Color: =clrTextPrimary
                                    FontWeight: =FontWeight.Normal
                                    Height: =24
                                    Size: =13
                                    Text: =Text(Coalesce(ThisItem.'Unit Price', 0), "#,##0.00")
                                    Width: =(Parent.TemplateWidth - 256) * 0.13 - 8
                                    X: =(Parent.TemplateWidth - 256) * 0.7 + 12
                                    Y: =16
                              - IvCLoc:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Left
                                    Color: =clrTextPrimary
                                    FontWeight: =FontWeight.Normal
                                    Height: =24
                                    Size: =13
                                    Text: =Coalesce(ThisItem.'Storage Location', "-")
                                    Width: =(Parent.TemplateWidth - 256) * 0.17 - 8
                                    X: =(Parent.TemplateWidth - 256) * 0.83 + 12
                                    Y: =16
                              - IvCStockEdit:
                                  Control: ModernNumberInput@1.1.2
                                  Properties:
                                    AccessibleLabel: ="Stock of " & ThisItem.'Item Name'
                                    Default: =Coalesce(ThisItem.'Current Stock', 0)
                                    Height: =36
                                    Max: =99999
                                    Min: =0
                                    OnChange: |-
                                      =IfError(
                                          Patch('Pantry Items', ThisItem, {'Current Stock': Self.Value});
                                          Patch(colItems, ThisItem, {'Current Stock': Self.Value});
                                          Notify(ThisItem.'Item Name' & " stock set to " & Self.Value & ".", NotificationType.Success),
                                          Notify("Couldn't update stock: " & FirstError.Message, NotificationType.Error)
                                      )
                                    Precision: =DecimalPrecision.'0'
                                    Step: =1
                                    Visible: =gRole = "Pantry Admin"
                                    Width: =(Parent.TemplateWidth - 256) * 0.11
                                    X: =(Parent.TemplateWidth - 256) * 0.48 + 4
                                    Y: =10
                              - IvCStatus:
                                  Control: ModernBadge@1.0.0
                                  Properties:
                                    Content: =If(ThisItem.'Current Stock' <= 0, "Out of stock", ThisItem.'Current Stock' <= ThisItem.'Minimum Stock Level', "Low stock", "In stock")
                                    Height: =24
                                    Intent: =If(ThisItem.'Current Stock' <= 0, BadgeIntent.Critical, ThisItem.'Current Stock' <= ThisItem.'Minimum Stock Level', BadgeIntent.Caution, BadgeIntent.Positive)
                                    Shape: =BadgeShape.Rounded
                                    Width: =110
                                    X: =Parent.TemplateWidth - 244
                                    Y: =16
                              - IvCAdd:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =36
                                    Icon: ="Add"
                                    OnSelect: |-
                                      =With({existing: LookUp(colCart, Item.'Pantry Item' = ThisItem.'Pantry Item'), qty: Coalesce(ThisItem.'Reorder Quantity', 1)},
                                          If(IsBlank(existing),
                                              Collect(colCart, {Item: ThisItem, Qty: qty}),
                                              Patch(colCart, existing, {Qty: existing.Qty + qty})
                                          )
                                      );
                                      If(ThisItem.'Current Stock' > ThisItem.'Minimum Stock Level',
                                          Notify(ThisItem.'Item Name' & " added. Note: the pantry still has " & ThisItem.'Current Stock' & " in stock.", NotificationType.Warning),
                                          Notify(ThisItem.'Item Name' & " added to your request.", NotificationType.Success)
                                      )
                                    Text: ="Request"
                                    Tooltip: ="Add the reorder quantity to your request"
                                    Width: =112
                                    X: =Parent.TemplateWidth - 124
                                    Y: =10
                              - IvCDivider:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =clrStroke
                                    Height: =1
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - 1
                        - IvRowsEmpty:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =80
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              Visible: =IsEmpty(IvRows.AllItems)
                            Children:
                              - IvRowsEmptyIcon:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    FillPortions: =0
                                    Height: =28
                                    Icon: ="SearchInfo"
                                    IconColor: =clrTextTertiary
                                    Width: =28
                              - IvRowsEmptyText:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =clrTextSecondary
                                    FillPortions: =0
                                    FontWeight: =FontWeight.Normal
                                    Height: =40
                                    Size: =13
                                    Text: ="No items match these filters."
                        - IvCount:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =clrTextSecondary
                              FillPortions: =0
                              FontWeight: =FontWeight.Normal
                              Height: =18
                              Size: =12
                              Text: =CountRows(IvRows.AllItems) & " of " & CountRows(colItems) & " items" & If(gRole = "Pantry Admin", "  ·  Edit a stock number and click away to save it.", "")
      - IvBusy:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.35)
            Height: =Parent.Height
            Visible: =locBusy
            Width: =Parent.Width
          Children:
            - IvBusyCard:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =clrSurface
                  Height: =120
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =280
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - IvBusySpinner:
                      Control: ModernSpinner@1.1.0
                      Properties:
                        Height: =80
                        Label: ="Working on it..."
                        LabelPosition: =SpinnerLabelPosition.Below
                        Width: =240
                        X: =20
                        Y: =20
